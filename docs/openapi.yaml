openapi: 3.1.0

info:
  title: Froglet Node API
  version: 1.1.0
  description: >
    HTTP API for a Froglet node. Froglet is a service-execution framework; the
    node exposes two distinct ports:

    - **Provider port** (default 8080) — public requester endpoints plus
      Bearer-authenticated local provider-control endpoints. Do not expose a
      provider-control token to requesters.

    - **Runtime port** (default 8081) — Bearer-authenticated endpoints used by
      the local operator to create deals via the marketplace, manage the wallet,
      and launch workloads.

    Both ports also expose the shared `/health`, `/v1/node/capabilities`, and
    `/v1/node/identity` endpoints.

servers:
  - url: http://localhost:8080
    description: Provider port (public requester routes plus authenticated local control routes)
  - url: http://localhost:8081
    description: Runtime port (local operator, Bearer auth required)

tags:
  - name: Common
    description: Health and node-identity endpoints available on both ports.
  - name: Hosted Trial
    description: First-party `try.froglet.dev` demo capability and session endpoints.
  - name: Catalog
    description: >
      Provider-port endpoints for discovering offers and services hosted by
      this node.
  - name: Deals (Provider)
    description: >
      Provider-port endpoints for the deal lifecycle — quoting, creating, and
      inspecting deals submitted by requesters.
  - name: Settlement (Provider)
    description: >
      Provider-port endpoints for Lightning payment bundles, preimage release,
      and receipt/bundle verification.
  - name: Events
    description: Publish and query signed node events. Also Nostr and curated-list verification.
  - name: Execution
    description: >
      Runtime-port endpoints for synchronous WASM execution and async job
      management. Runtime routes are Bearer-authenticated and should also be
      bound or firewalled as an operator-only surface.
  - name: Deals (Runtime)
    description: >
      Runtime-port endpoints for creating and tracking outbound deals through
      a remote provider (quote + deal negotiated automatically).
  - name: Settlement (Runtime)
    description: Runtime-port endpoints for wallet balance and deal payment-intent management.
  - name: Discovery (Runtime)
    description: Marketplace search and provider-detail lookup via the runtime port.
  - name: Feed & Artifacts
    description: Paginated artifact feed and single-artifact retrieval.
  - name: Provider Control
    description: >
      Bearer-authenticated local provider management endpoints plus the
      explicitly public, concurrency-bounded signed Publication canary.
  - name: Confidential
    description: TEE confidential-profile and session management.

security: []

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Static Bearer token configured via `FROGLET_RUNTIME_AUTH_TOKEN`.
        Pass as `Authorization: Bearer <token>` on all runtime-port endpoints
        that require authentication.
    ProviderControlBearerAuth:
      type: http
      scheme: bearer
      description: >
        Static Bearer token configured via `FROGLET_PROVIDER_CONTROL_AUTH_TOKEN`.
        Pass as `Authorization: Bearer <token>` on provider-control endpoints.

  parameters:
    PublicationServiceId:
      name: service_id
      in: path
      required: true
      description: Canonical publication service identifier, 1-128 bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PublicationRevisionHash:
      name: revision_hash
      in: path
      required: true
      description: Exact immutable Publication Revision hash.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    ManagedPublicationOperationId:
      name: operation_id
      in: path
      required: true
      description: Domain-separated Managed Publication operation identifier.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'

  responses:
    ProviderControlUnauthorized:
      description: Missing or invalid provider-control bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidPublicationIdentifier:
      description: Invalid service identifier or revision hash.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PublicationLifecycleConflict:
      description: >
        Lifecycle transition is not valid for the current state, or a legacy
        unverified offer must be republished with a fixture first. Exact
        compensation also returns this response when its revision hash or
        activation token is stale.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PublicationLifecycleFailure:
      description: Publication lifecycle storage or mutation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      description: Standard error envelope returned on 4xx and 5xx responses.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: deal not found
        details:
          type: string
          description: Additional diagnostic context, present on some errors.
        deal_id:
          type: string
          description: >
            Echoed deal ID, present when the error is scoped to a specific deal.
        service_id:
          type: string
          description: Echoed service ID on publication lifecycle errors.
        revision_hash:
          type: string
          description: Echoed immutable revision hash on revision-scoped errors.
        lifecycle_status:
          type: string
          description: Current lifecycle classification when it explains a conflict.
        remediation:
          type: string
          description: Safe next action when the server can provide one.
        actual_bytes:
          type: integer
          description: Observed request size on bounded publication errors.
        max_bytes:
          type: integer
          description: Enforced byte limit paired with `actual_bytes`.

    ManagedPublicationBundle:
      type: object
      description: Canonical `froglet.managed-publication.bundle.v1` runtime bundle manifest.
      additionalProperties: true

    ManagedPublicationPackage:
      type: object
      description: Exact deterministic private OCI package contract.
      additionalProperties: true

    ManagedPublicationPlan:
      type: object
      description: >
        `froglet.managed-publication.plan.v1`; its hash binds the package,
        target/profile, Provider identity, public URL, portable desired state,
        operator plans, compensation, and recurring-cost disclosure.
      required: [plan_hash, payload]
      properties:
        plan_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false

    ManagedPublicationCapsule:
      type: object
      description: >
        Provider-private `froglet.managed-publication.capsule.v1` containing
        the approved plan, source revision hash, endpoint-specific signed
        Descriptor/Offer/Revision chain, and private verification fixture.
      additionalProperties: true

    ManagedPublicationOperationRecord:
      type: object
      description: >
        Durable compare-and-swap operation record containing canonical plan,
        operation evidence, optional capsule, state version, and creation time.
      required: [plan, operation, state_version, created_at_epoch_seconds]
      properties:
        plan:
          $ref: '#/components/schemas/ManagedPublicationPlan'
        operation:
          type: object
          additionalProperties: true
        capsule:
          $ref: '#/components/schemas/ManagedPublicationCapsule'
        state_version:
          type: integer
          minimum: 1
        created_at_epoch_seconds:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false

    ManagedPublicationRegistration:
      type: object
      required:
        - marketplace_url
        - status
        - provider_id
        - validated_offer_hash
        - validated_revision_hash
        - registered_at_epoch_seconds
      properties:
        marketplace_url:
          type: string
          format: uri
        status:
          type: string
          enum: [active, pending_review]
        provider_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        validated_offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        validated_revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        registered_at_epoch_seconds:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false

    SignedArtifact:
      type: object
      description: >
        Froglet signed artifact envelope. Every on-chain document is wrapped in
        this envelope. The `payload` field carries the type-specific data.
        `hash` is the SHA-256 of the canonical signing bytes; `signature` is
        the hex BIP340 Schnorr signature over those same bytes.
      required:
        - artifact_type
        - schema_version
        - signer
        - created_at
        - payload_hash
        - payload
        - signature
      properties:
        artifact_type:
          type: string
          description: >
            Kind discriminator. One of `descriptor`, `offer`, `quote`, `deal`,
            `receipt`, `curated_list`, `confidential_profile`,
            `confidential_session`, `invoice_bundle`.
          example: deal
        schema_version:
          type: string
          description: Always `froglet/v1` for the current protocol revision.
          example: froglet/v1
        signer:
          type: string
          description: Hex-encoded 32-byte x-only secp256k1 public key of the signing node.
          example: "abcd1234..."
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the artifact was signed.
        payload_hash:
          type: string
          description: SHA-256 hex digest of the canonical JSON payload.
        hash:
          type: string
          description: >
            SHA-256 hex digest of the canonical signing bytes. Serves as the
            global artifact identifier.
        payload:
          type: object
          description: Type-specific payload. See the concrete payload schemas below.
          additionalProperties: true
        signature:
          type: string
          description: BIP340 Schnorr signature (hex) over the canonical signing bytes.

    DescriptorPayload:
      type: object
      description: >
        Payload carried inside a `descriptor` SignedArtifact. Describes the
        provider's identity, transport endpoints, and declared capabilities.
      required:
        - provider_id
        - protocol_version
        - capabilities
      properties:
        provider_id:
          type: string
          description: Stable identifier for this provider (hex public key).
        descriptor_seq:
          type: integer
          format: int64
          description: Monotonically increasing descriptor sequence number.
        protocol_version:
          type: string
          example: froglet/v1
        expires_at:
          type: integer
          format: int64
          description: Optional Unix timestamp after which this descriptor should be refreshed.
        linked_identities:
          type: array
          description: External identities linked to this provider (e.g. Nostr pubkey).
          items:
            $ref: '#/components/schemas/LinkedIdentity'
        transport_endpoints:
          type: array
          description: Reachable transport endpoints for this provider.
          items:
            $ref: '#/components/schemas/TransportEndpoint'
        capabilities:
          type: object
          description: Declared service and execution capabilities.
          properties:
            service_kinds:
              type: array
              items:
                type: string
              example: ["compute.execution.v1"]
            execution_runtimes:
              type: array
              items:
                type: string
              example: ["wasm", "python", "container"]
            max_concurrent_deals:
              type: integer
              description: Maximum concurrent deals the provider will accept. Absent means no declared limit.

    LinkedIdentity:
      type: object
      description: Cross-identity link (e.g. a Nostr public key attesting this provider).
      required:
        - identity_kind
        - identity
        - scope
        - created_at
        - signature_algorithm
        - linked_signature
      properties:
        identity_kind:
          type: string
          example: nostr
        identity:
          type: string
          description: The external identity (e.g. Nostr hex pubkey).
        scope:
          type: array
          items:
            type: string
          description: Scopes granted to this linked identity.
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        signature_algorithm:
          type: string
          example: secp256k1_schnorr_bip340
        linked_signature:
          type: string

    TransportEndpoint:
      type: object
      description: A reachable network endpoint for this provider.
      required:
        - transport
        - uri
        - priority
      properties:
        transport:
          type: string
          example: clearnet
        uri:
          type: string
          example: https://provider.example
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        priority:
          type: integer
          format: int32
          description: Lower value means higher preference.
        features:
          type: array
          items:
            type: string

    OfferPayload:
      type: object
      description: >
        Payload inside an `offer` SignedArtifact. Describes a priced execution
        offer that requesters can reference when creating quotes.
      required:
        - provider_id
        - offer_id
        - descriptor_hash
        - offer_kind
        - settlement_method
        - quote_ttl_secs
        - execution_profile
        - price_schedule
      properties:
        provider_id:
          type: string
        offer_id:
          type: string
          example: service.echo
        descriptor_hash:
          type: string
        expires_at:
          type: integer
          format: int64
        offer_kind:
          type: string
          example: compute.execution.v1
        settlement_method:
          type: string
          example: lightning
        quote_ttl_secs:
          type: integer
          format: int64
        execution_profile:
          type: object
          description: Resource limits and runtime constraints for this offer.
          properties:
            runtime:
              type: string
              example: wasm
            package_kind:
              type: string
            contract_version:
              type: string
            access_handles:
              type: array
              items:
                type: string
            abi_version:
              type: string
            capabilities:
              type: array
              items:
                type: string
            max_input_bytes:
              type: integer
            max_runtime_ms:
              type: integer
              format: int64
            max_memory_bytes:
              type: integer
            max_output_bytes:
              type: integer
            fuel_limit:
              type: integer
              format: int64
        price_schedule:
          type: object
          properties:
            base_fee_msat:
              type: integer
              format: int64
              description: Fixed fee in millisatoshis regardless of outcome.
            success_fee_msat:
              type: integer
              format: int64
              description: Fee in millisatoshis charged only on successful execution.
        terms_hash:
          type: string
        confidential_profile_hash:
          type: string

    QuotePayload:
      type: object
      description: >
        Payload inside a `quote` SignedArtifact. Issued by the provider in
        response to a quote request. Binds a requester, a workload, and
        settlement terms together with an expiry.
      required:
        - provider_id
        - requester_id
        - descriptor_hash
        - offer_hash
        - expires_at
        - workload_kind
        - workload_hash
        - settlement_terms
        - execution_limits
      properties:
        provider_id:
          type: string
        requester_id:
          type: string
        descriptor_hash:
          type: string
        offer_hash:
          type: string
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp after which this quote must not be used.
        workload_kind:
          type: string
          example: compute.execution.v1
        workload_hash:
          type: string
          description: SHA-256 of the canonical workload specification.
        confidential_session_hash:
          type: string
        capabilities_granted:
          type: array
          items:
            type: string
        extension_refs:
          type: array
          items:
            type: string
        quote_use:
          type: string
        settlement_terms:
          $ref: '#/components/schemas/QuoteSettlementTerms'
        execution_limits:
          $ref: '#/components/schemas/ExecutionLimits'

    QuoteSettlementTerms:
      type: object
      description: Lightning settlement parameters baked into a quote.
      required:
        - method
        - destination_identity
        - base_fee_msat
        - success_fee_msat
        - max_base_invoice_expiry_secs
        - max_success_hold_expiry_secs
        - min_final_cltv_expiry
      properties:
        method:
          type: string
          example: lightning
        destination_identity:
          type: string
          description: Lightning node public key (hex) to which payments are routed.
        base_fee_msat:
          type: integer
          format: int64
        success_fee_msat:
          type: integer
          format: int64
        max_base_invoice_expiry_secs:
          type: integer
          format: int64
        max_success_hold_expiry_secs:
          type: integer
          format: int64
        min_final_cltv_expiry:
          type: integer
          format: int32

    ExecutionLimits:
      type: object
      description: Resource limits applied during execution and echoed in receipts.
      required:
        - max_input_bytes
        - max_runtime_ms
        - max_memory_bytes
        - max_output_bytes
        - fuel_limit
      properties:
        max_input_bytes:
          type: integer
        max_runtime_ms:
          type: integer
          format: int64
        max_memory_bytes:
          type: integer
        max_output_bytes:
          type: integer
        fuel_limit:
          type: integer
          format: int64

    DealPayload:
      type: object
      description: >
        Payload inside a `deal` SignedArtifact. Signed by the requester. Commits
        both parties to the terms established in the referenced quote.
      required:
        - requester_id
        - provider_id
        - quote_hash
        - workload_hash
        - success_payment_hash
        - admission_deadline
        - completion_deadline
        - acceptance_deadline
      properties:
        requester_id:
          type: string
        provider_id:
          type: string
        quote_hash:
          type: string
        workload_hash:
          type: string
        confidential_session_hash:
          type: string
        extension_refs:
          type: array
          items:
            type: string
        authority_ref:
          type: string
        supersedes_deal_hash:
          type: string
        client_nonce:
          type: string
        success_payment_hash:
          type: string
          description: >
            SHA-256 hash of the success preimage. Used in Lightning hold-invoice
            settlement as the payment hash for the success leg.
        admission_deadline:
          type: integer
          format: int64
          description: Unix timestamp by which the provider must admit the deal.
        completion_deadline:
          type: integer
          format: int64
          description: Unix timestamp by which execution must complete.
        acceptance_deadline:
          type: integer
          format: int64
          description: Unix timestamp by which the requester must release the preimage.

    ReceiptPayload:
      type: object
      description: >
        Payload inside a `receipt` SignedArtifact. Issued by the provider after
        execution. Attests execution outcome, settlement legs, and resource usage.
      required:
        - provider_id
        - requester_id
        - deal_hash
        - quote_hash
        - finished_at
        - deal_state
        - execution_state
        - settlement_state
        - executor
        - limits_applied
        - settlement_refs
      properties:
        provider_id:
          type: string
        requester_id:
          type: string
        deal_hash:
          type: string
        quote_hash:
          type: string
        extension_refs:
          type: array
          items:
            type: string
        acceptance_ref:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        deal_state:
          type: string
          example: succeeded
        execution_state:
          type: string
          example: succeeded
        settlement_state:
          type: string
          example: settled
        result_hash:
          type: string
          description: SHA-256 of the canonical result JSON.
        confidential_session_hash:
          type: string
        result_envelope_hash:
          type: string
        result_format:
          type: string
        executor:
          type: object
          description: Runtime context in which the workload was executed.
          properties:
            runtime:
              type: string
              example: wasm
            runtime_version:
              type: string
            execution_mode:
              type: string
            attestation_platform:
              type: string
            measurement:
              type: string
            abi_version:
              type: string
            module_hash:
              type: string
            capabilities_granted:
              type: array
              items:
                type: string
        limits_applied:
          $ref: '#/components/schemas/ExecutionLimits'
        settlement_refs:
          type: object
          description: Settlement method and per-leg state at receipt issuance time.
          properties:
            method:
              type: string
            bundle_hash:
              type: string
            destination_identity:
              type: string
            base_fee:
              $ref: '#/components/schemas/ReceiptSettlementLeg'
            success_fee:
              $ref: '#/components/schemas/ReceiptSettlementLeg'
        failure_code:
          type: string
        failure_message:
          type: string
        result_ref:
          type: string

    ReceiptSettlementLeg:
      type: object
      description: Per-leg payment state captured inside a receipt.
      required:
        - amount_msat
        - invoice_hash
        - payment_hash
        - state
      properties:
        amount_msat:
          type: integer
          format: int64
        invoice_hash:
          type: string
        payment_hash:
          type: string
        state:
          type: string
          enum: [open, accepted, settled, canceled, expired]

    InvoiceBundlePayload:
      type: object
      description: >
        Payload inside an `invoice_bundle` SignedArtifact. Contains two
        Lightning hold invoices — `base_fee` (unconditional) and `success_fee`
        (released only on success).
      required:
        - provider_id
        - requester_id
        - quote_hash
        - deal_hash
        - expires_at
        - destination_identity
        - base_fee
        - success_fee
        - min_final_cltv_expiry
      properties:
        provider_id:
          type: string
        requester_id:
          type: string
        quote_hash:
          type: string
        deal_hash:
          type: string
        expires_at:
          type: integer
          format: int64
        destination_identity:
          type: string
        base_fee:
          $ref: '#/components/schemas/InvoiceBundleLeg'
        success_fee:
          $ref: '#/components/schemas/InvoiceBundleLeg'
        min_final_cltv_expiry:
          type: integer
          format: int32

    InvoiceBundleLeg:
      type: object
      description: A single Lightning hold invoice inside an invoice bundle.
      required:
        - amount_msat
        - invoice_bolt11
        - invoice_hash
        - payment_hash
        - state
      properties:
        amount_msat:
          type: integer
          format: int64
        invoice_bolt11:
          type: string
          description: BOLT-11 encoded Lightning invoice string.
        invoice_hash:
          type: string
        payment_hash:
          type: string
        state:
          type: string
          enum: [open, accepted, settled, canceled, expired]

    DealRecord:
      type: object
      description: >
        Provider-side view of a deal. Returned by the provider-port deal endpoints.
        `status` progresses through: `accepted` -> `payment_pending` ->
        `running` -> `result_ready` | `settlement_pending` | `succeeded` |
        `failed` | `rejected`. `settlement_pending` is runtime-local and means
        execution failed but external settlement is not yet proven terminal;
        no signed receipt exists in that state.
      required:
        - deal_id
        - status
        - workload_kind
        - deal
        - quote
        - created_at
        - updated_at
      properties:
        deal_id:
          type: string
        idempotency_key:
          type: string
        status:
          type: string
          enum:
            - accepted
            - payment_pending
            - running
            - result_ready
            - settlement_pending
            - succeeded
            - failed
            - rejected
        workload_kind:
          type: string
        deal:
          $ref: '#/components/schemas/SignedArtifact'
        quote:
          $ref: '#/components/schemas/SignedArtifact'
        result:
          description: Execution result payload, present when status is `result_ready` or `succeeded`.
          type: object
          additionalProperties: true
        result_hash:
          type: string
        error:
          type: string
          description: Failure description, present when status is `failed` or `rejected`.
        receipt:
          $ref: '#/components/schemas/SignedArtifact'
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    RequesterDealRecord:
      type: object
      description: >
        Runtime-side view of an outbound deal. Mirrors DealRecord but adds
        `provider_id` and `provider_url` from the local requester database.
      required:
        - deal_id
        - provider_id
        - provider_url
        - status
        - workload_kind
        - deal
        - quote
        - created_at
        - updated_at
      properties:
        deal_id:
          type: string
        idempotency_key:
          type: string
        provider_id:
          type: string
        provider_url:
          type: string
        status:
          type: string
          enum:
            - accepted
            - payment_pending
            - running
            - result_ready
            - settlement_pending
            - succeeded
            - failed
            - rejected
        workload_kind:
          type: string
        quote:
          $ref: '#/components/schemas/SignedArtifact'
        deal:
          $ref: '#/components/schemas/SignedArtifact'
        result:
          type: object
          additionalProperties: true
        result_hash:
          type: string
        error:
          type: string
        receipt:
          $ref: '#/components/schemas/SignedArtifact'
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    JobRecord:
      type: object
      description: >
        Async job record. Status progresses through: `queued` -> `running` ->
        `succeeded` | `failed`.
      required:
        - job_id
        - service_id
        - kind
        - status
        - created_at
        - updated_at
      properties:
        job_id:
          type: string
          description: Hex job identifier.
        idempotency_key:
          type: string
        service_id:
          type: string
          description: Internal service class (`execute_wasm`, `events_query`, etc.).
        kind:
          type: string
          description: Job kind discriminator matching the JobSpec variant (`wasm`, `execution`, `oci_wasm`).
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          type: object
          additionalProperties: true
          description: Present when status is `succeeded`.
        error:
          type: string
          description: Present when status is `failed`.
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    LedgerArtifact:
      type: object
      description: A single entry in the artifact feed, including its full document.
      required:
        - cursor
        - hash
        - payload_hash
        - kind
        - actor_id
        - created_at
        - document
      properties:
        cursor:
          type: integer
          format: int64
          description: Opaque pagination cursor (monotonically increasing feed sequence).
        hash:
          type: string
          description: SHA-256 artifact hash, used as the artifact identifier.
        payload_hash:
          type: string
        kind:
          type: string
          example: deal
        actor_id:
          type: string
        created_at:
          type: integer
          format: int64
        document:
          $ref: '#/components/schemas/SignedArtifact'

    LightningWalletIntent:
      type: object
      description: >
        Wallet payment intent returned after creating a deal that requires
        Lightning settlement. Provides all the information a wallet needs to
        display pending invoices and trigger preimage release.
      required:
        - backend
        - mode
        - session_id
        - bundle_hash
        - deal_id
        - deal_status
        - quote_hash
        - deal_hash
        - destination_identity
        - admission_ready
        - result_ready
        - can_release_preimage
        - payment_requests
      properties:
        backend:
          type: string
          example: lightning
        mode:
          type: string
          example: lnd_rest
        session_id:
          type: string
        bundle_hash:
          type: string
        deal_id:
          type: string
        deal_status:
          type: string
        quote_hash:
          type: string
        deal_hash:
          type: string
        destination_identity:
          type: string
        admission_ready:
          type: boolean
          description: Whether the base-fee invoice is ready to pay.
        result_ready:
          type: boolean
          description: Whether the success-fee invoice is ready to pay.
        can_release_preimage:
          type: boolean
          description: Whether the requester can now release the preimage to finalize payment.
        payment_requests:
          type: array
          items:
            type: object
            description: Individual Lightning invoice details.
            properties:
              role:
                type: string
                enum: [base_fee, success_fee]
              invoice:
                type: string
                description: BOLT-11 encoded invoice.
              amount_msat:
                type: integer
                format: int64
              payment_hash:
                type: string
              state:
                type: string
                enum: [open, accepted, settled, canceled, expired]
        mock_action:
          type: object
          description: Present in mock-payment mode. Provides the path to call to simulate payment.
          properties:
            endpoint_path:
              type: string
        release_action:
          type: object
          description: Present when the preimage can be released. Provides the path to call.
          properties:
            endpoint_path:
              type: string
            payment_hash:
              type: string
            expected_result_hash:
              type: string

    NodeCapabilities:
      type: object
      description: Full capability advertisement returned by `/v1/node/capabilities`.
      required:
        - api_version
        - version
        - identity
        - discovery
        - transports
        - execution
        - limits
        - pricing
        - payments
        - faas
      properties:
        api_version:
          type: string
          example: v1
        version:
          type: string
          description: Froglet node binary version (semver).
        identity:
          $ref: '#/components/schemas/IdentityInfo'
        discovery:
          type: object
          properties:
            mode:
              type: string
              example: none
        transports:
          type: object
          properties:
            clearnet:
              type: object
              properties:
                enabled:
                  type: boolean
                url:
                  type: string
            tor:
              type: object
              properties:
                enabled:
                  type: boolean
                onion_url:
                  type: string
                status:
                  type: string
            relay:
              type: object
              required: [enabled, status]
              properties:
                enabled:
                  type: boolean
                  description: Endpoint planning is configured; this alone does not open a tunnel.
                control_url:
                  type: string
                  format: uri
                  description: Exact WSS control endpoint bound into publication consent and grants.
                url:
                  type: string
                  format: uri
                  pattern: '^https://'
                  description: Deterministic identity-bound public origin planned without network activity.
                status:
                  type: string
                  enum: [disabled, reserved, starting, up, down]
        execution:
          type: object
          properties:
            wasm:
              type: object
              properties:
                enabled:
                  type: boolean
                fuel_limit:
                  type: integer
                  format: int64
                entrypoints:
                  type: array
                  items:
                    type: string
            gpu:
              type: object
              description: Provider-configured GPU advertisement. Presence does not prove hardware execution until a GPU-backed workload succeeds.
              properties:
                enabled:
                  type: boolean
                count:
                  type: integer
                vendor:
                  type: string
                model:
                  type: string
                memory_mb:
                  type: integer
                  format: int64
                container_runtime:
                  type: string
                capabilities:
                  type: array
                  items:
                    type: string
        limits:
          type: object
          properties:
            events_query_limit_default:
              type: integer
            events_query_limit_max:
              type: integer
            body_limit_bytes:
              type: integer
            wasm_hex_limit_bytes:
              type: integer
            wasm_input_limit_bytes:
              type: integer
        pricing:
          type: object
          description: Provider pricing configuration (structure mirrors `PricingInfo`).
          additionalProperties: true
        payments:
          type: object
          properties:
            backend:
              type: string
            verifier_mode:
              type: string
            accepted_payment_methods:
              type: array
              items:
                type: string
            reservations:
              type: boolean
            receipts:
              type: boolean
        faas:
          type: object
          properties:
            jobs_api:
              type: boolean
            async_jobs:
              type: boolean
            idempotency_keys:
              type: boolean
            runtimes:
              type: array
              items:
                type: string

    IdentityInfo:
      type: object
      description: Node identity (returned by `/v1/node/identity` and embedded in capabilities).
      required:
        - node_id
        - public_key
      properties:
        node_id:
          type: string
          description: Stable node identifier (hex 32-byte x-only secp256k1 public key).
        public_key:
          type: string
          description: Same as `node_id`; the hex-encoded x-only secp256k1 public key.

    ProviderServiceRecord:
      type: object
      description: >
        A service as seen from the provider's public catalog. Price fields are
        exposed together so clients do not have to infer the settlement rail
        or discard either fee leg. Provider-private verification fixtures are
        never included in this record.
      required:
        - service_id
        - offer_id
        - summary
        - mode
        - price_sats
        - base_fee_msat
        - success_fee_msat
        - settlement_method
        - publication_state
        - provider_id
      properties:
        service_id:
          type: string
        offer_id:
          type: string
        offer_kind:
          type: string
        resource_kind:
          type: string
          example: service
        project_id:
          type: string
        summary:
          type: string
        runtime:
          type: string
        package_kind:
          type: string
        entrypoint_kind:
          type: string
        entrypoint:
          type: string
        contract_version:
          type: string
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionMount'
        capabilities:
          type: array
          description: Provider-required capability strings such as `compute.gpu`; callers must not infer capability support unless listed.
          items:
            type: string
        mode:
          type: string
          enum: [sync, async]
        price_sats:
          type: integer
          format: int64
          minimum: 0
          description: >
            Legacy whole-unit total. Read with `price_currency`; the explicit
            fee legs and `settlement_method` remain authoritative.
        base_fee_msat:
          type: integer
          format: int64
          minimum: 0
          description: Base-fee leg copied from the signed offer price schedule.
        success_fee_msat:
          type: integer
          format: int64
          minimum: 0
          description: Success-fee leg copied from the signed offer price schedule.
        settlement_method:
          type: string
          description: >
            Exact settlement method advertised by the signed offer, such as
            `none`, `lightning.prepaid.v1`,
            `lightning.base_fee_plus_success_fee.v1`, or `stripe_mpp.v1`.
        price_currency:
          $ref: '#/components/schemas/PublicationCurrency'
        publication_state:
          type: string
          enum: [active, hidden]
        provider_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        module_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        binding_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        starter:
          type: string
          description: Compact JSON example input for LLM/client guidance.
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        module_bytes_hex:
          type: string
          description: Present only in authorized views that request executable binding material.
        inline_source:
          type: string
          description: Present only in authorized views that request executable binding material.
        oci_reference:
          type: string
          description: Present only in authorized views that request executable binding material.
        oci_digest:
          type: string
          description: Present only in authorized views that request executable binding material.
      example:
        service_id: data-summary
        offer_id: data-summary-v1
        summary: Summarize a provider-owned dataset
        mode: sync
        price_sats: 500
        base_fee_msat: 0
        success_fee_msat: 500000
        settlement_method: stripe_mpp.v1
        price_currency: usd
        publication_state: active
        provider_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

    PublicationSettlement:
      type: string
      enum: [none, lightning, stripe]
      description: >
        Authoring-level settlement intent. The provider maps this to the exact
        method in the signed offer; it is not itself a Kernel settlement
        method identifier.

    PublicationCurrency:
      type: string
      enum: [sat, usd]
      description: >
        Whole-unit currency: `sat` means satoshis and `usd` means US cents.

    PublicationMount:
      type: object
      additionalProperties: false
      required:
        - handle
        - kind
      properties:
        handle:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
          example: warehouse
        kind:
          type: string
          enum: [postgres, sqlite, object_store, redis, s3]
          description: >
            New authoring uses object_store. The historical s3 value is a
            compatibility input normalized before a new revision is signed.
        read_only:
          type: boolean
          default: true
          description: Publication authoring defaults mounts to read-only.
        binding:
          type: string
          readOnly: true
          description: >
            Provider-owned binding material. It must be omitted from a
            PublicationIntent; author-supplied values are rejected.

    ExecutionMount:
      type: object
      additionalProperties: false
      required:
        - handle
        - kind
        - read_only
      properties:
        handle:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
        kind:
          type: string
          enum: [postgres, sqlite, object_store, redis, s3]
          description: >
            Runtime records may contain legacy s3. Capability grants remain
            exact to the record's kind and are not interchangeable aliases.
        read_only:
          type: boolean
        binding:
          type: string
          description: Provider-resolved binding; omitted from public catalog views.

    PublicationLimits:
      type: object
      additionalProperties: false
      description: >
        Requested ceilings. Omitted fields resolve to provider defaults;
        requests above provider maxima are rejected.
      properties:
        max_input_bytes:
          type: integer
          format: int64
          minimum: 1
        max_runtime_ms:
          type: integer
          format: int64
          minimum: 1
        max_memory_bytes:
          type: integer
          format: int64
          minimum: 1
        max_output_bytes:
          type: integer
          format: int64
          minimum: 1
        fuel_limit:
          type: integer
          format: int64
          minimum: 0
          description: Zero means no separate fuel ceiling within the runtime limit.

    ResolvedPublicationLimits:
      type: object
      additionalProperties: false
      required:
        - max_input_bytes
        - max_runtime_ms
        - max_memory_bytes
        - max_output_bytes
        - fuel_limit
      properties:
        max_input_bytes:
          type: integer
          format: int64
          minimum: 1
        max_runtime_ms:
          type: integer
          format: int64
          minimum: 1
        max_memory_bytes:
          type: integer
          format: int64
          minimum: 1
        max_output_bytes:
          type: integer
          format: int64
          minimum: 1
        fuel_limit:
          type: integer
          format: int64
          minimum: 0

    VerificationFixture:
      type: object
      additionalProperties: false
      description: >
        Provider-private local invocation fixture. Use exactly one of `input`
        or the JSON-string compatibility alias `input_json`, and at most one
        expected-output representation. The fixture is not copied to public
        catalog records, signed offers, or the artifact feed.
      oneOf:
        - required: [input]
          not:
            required: [input_json]
        - required: [input_json]
          not:
            required: [input]
      allOf:
        - not:
            required: [expected_output, expected_output_json]
      properties:
        input:
          description: Any JSON value passed to the service.
        input_json:
          type: string
          description: Compatibility form containing a JSON-encoded value.
        expected_output:
          description: Optional exact JSON value expected from local execution.
        expected_output_json:
          type: string
          description: Compatibility form containing a JSON-encoded expected value.

    LocalVerificationEvidence:
      type: object
      additionalProperties: false
      required:
        - input_hash
        - result_hash
      description: >
        Operational evidence returned after provider-local execution. This is
        not a Kernel artifact and does not prove public reachability,
        marketplace listing, or payment settlement.
      properties:
        input_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the canonical private fixture input; the input itself is not disclosed.
        result_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        expected_output_matched:
          type: boolean
          description: Present only when the fixture supplied an expected output.
      example:
        input_hash: 1f64d68ec3c32015b91a00d4f82cfd30f5eb9659407a4ac81e29f5994e135439
        result_hash: 8e9f9d26d45557be4c981a02c8a8f86b12f5a3a4fa5b4bfb2ca652f91f5f0b31
        expected_output_matched: true

    PublicationCsvColumn:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum: [string, integer, number, boolean]
        nullable:
          type: boolean
          default: false
        indexed:
          type: boolean
          default: false

    PublicationCsvSchema:
      type: object
      additionalProperties: false
      required: [collection, columns]
      properties:
        collection:
          type: string
          minLength: 1
          maxLength: 128
        columns:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/PublicationCsvColumn'
          description: Ordered CSV header and types; at least one column must set indexed=true.

    PublicationDataSource:
      type: object
      additionalProperties: false
      required: [format, content_base64]
      properties:
        format:
          type: string
          enum: [json, csv, sqlite]
        content_base64:
          type: string
          format: byte
          description: Canonical padded base64; decoded bytes are limited to 16 MiB.
        csv_schema:
          $ref: '#/components/schemas/PublicationCsvSchema'
          description: Required only when format=csv and rejected for JSON/SQLite.

    PythonRuntimeLock:
      type: object
      additionalProperties: false
      required: [implementation, version, abi]
      properties:
        implementation:
          type: string
          const: cpython
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          description: Exact CPython major.minor.patch compatibility identity.
        abi:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-z0-9_-]+$'

    PythonLockedArtifact:
      type: object
      additionalProperties: false
      required: [name, version, filename, sha256]
      properties:
        name:
          type: string
        version:
          type: string
        filename:
          type: string
          pattern: '^[A-Za-z0-9._-]+-none-any\.whl$'
          description: Pure-Python wheel basename; paths and native wheel tags are rejected.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    PythonLockManifestV1:
      type: object
      additionalProperties: false
      required: [schema_version, source_sha256, runtime]
      properties:
        schema_version:
          type: string
          const: froglet.python-lock.v1
        source_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        runtime:
          $ref: '#/components/schemas/PythonRuntimeLock'
        artifacts:
          type: array
          maxItems: 256
          description: Sorted, unique, hash-pinned pure-Python wheel declarations.
          items:
            $ref: '#/components/schemas/PythonLockedArtifact'

    LockedPythonBundleArtifact:
      type: object
      additionalProperties: false
      required: [locked, content_base64]
      properties:
        locked:
          $ref: '#/components/schemas/PythonLockedArtifact'
        content_base64:
          type: string
          format: byte

    LockedPythonBundleEnvelopeV1:
      type: object
      additionalProperties: false
      description: >
        Provider-private, resolver-free package containing exact UTF-8 source,
        its canonical lock, and any hash-pinned pure-Python wheels. The package
        binding is the SHA-256 of this entire canonical envelope, not a source-only hash.
      required: [schema_version, lock, lock_sha256, source_base64]
      properties:
        schema_version:
          type: string
          const: froglet.python-bundle.v1
        lock:
          $ref: '#/components/schemas/PythonLockManifestV1'
        lock_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        source_base64:
          type: string
          format: byte
        artifacts:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/LockedPythonBundleArtifact'

    PublicationDependencyComponent:
      type: object
      additionalProperties: false
      required: [role, name, version, digest]
      properties:
        role:
          type: string
        name:
          type: string
        version:
          type: string
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'

    PublicationBuildEvidenceV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - builder
        - builder_version
        - source_digest
        - artifact_digest
        - dependency_mode
        - hermetic
      properties:
        schema_version:
          type: string
          const: froglet.publication-build-evidence.v1
        builder:
          type: string
        builder_version:
          type: string
        source_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        artifact_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Must equal the enclosing revision package_digest.
        dependency_mode:
          type: string
          enum: [none, locked, unresolved]
        components:
          type: array
          items:
            $ref: '#/components/schemas/PublicationDependencyComponent'
          description: Sorted and unique; required for locked and empty otherwise.
        hermetic:
          type: boolean

    PublicationRevisionPrice:
      type: object
      additionalProperties: false
      required:
        - settlement_method
        - currency
        - base_amount_minor
        - success_amount_minor
        - offer_settlement_method
      properties:
        settlement_method:
          $ref: '#/components/schemas/PublicationSettlement'
        currency:
          $ref: '#/components/schemas/PublicationCurrency'
        base_amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: Satoshis for `sat`; US cents for `usd`.
        success_amount_minor:
          type: integer
          format: int64
          minimum: 0
          description: Satoshis for `sat`; US cents for `usd`.
        offer_settlement_method:
          type: string
          description: Exact method bound into the linked signed offer.
      example:
        settlement_method: stripe
        currency: usd
        base_amount_minor: 25
        success_amount_minor: 500
        offer_settlement_method: stripe_mpp.v1

    PublicationRevisionServiceV1:
      type: object
      additionalProperties: false
      required:
        - source_kind
        - entrypoint_kind
        - entrypoint
        - contract_version
        - mode
      description: >
        Immutable public service interface and access declaration. It excludes
        provider-private mount bindings and verification inputs. Capabilities
        are the effective sorted set, including mount-derived access
        declarations, and mirror the linked signed offer.
      properties:
        project_id:
          type: string
          minLength: 1
        summary:
          type: string
          description: At most 16 KiB when UTF-8 encoded.
        starter:
          type: string
          description: At most 16 KiB when UTF-8 encoded.
        source_kind:
          type: string
          minLength: 1
        entrypoint_kind:
          type: string
          minLength: 1
        entrypoint:
          type: string
          minLength: 1
        contract_version:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [sync, async]
        mounts:
          type: array
          maxItems: 64
          description: Handles are unique and provider-owned bindings are absent.
          items:
            $ref: '#/components/schemas/PublicationMount'
        capabilities:
          type: array
          maxItems: 128
          uniqueItems: true
          description: Sorted, unique capability strings; each is at most 128 bytes.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*$'
        input_schema:
          description: Optional JSON Schema, capped at 64 KiB of canonical JSON.
        output_schema:
          description: Optional JSON Schema, capped at 64 KiB of canonical JSON.

    PublicationRevisionPayloadV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - provider_id
        - service_id
        - offer_id
        - offer_hash
        - binding_hash
        - package_digest
        - runtime
        - package_kind
        - service
        - limits
        - price
        - local_verification
      properties:
        schema_version:
          type: string
          const: froglet.publication-revision.v1
        provider_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        service_id:
          type: string
        offer_id:
          type: string
        offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        binding_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        package_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        runtime:
          type: string
        package_kind:
          type: string
        build_evidence:
          $ref: '#/components/schemas/PublicationBuildEvidenceV1'
        service:
          $ref: '#/components/schemas/PublicationRevisionServiceV1'
        limits:
          $ref: '#/components/schemas/ResolvedPublicationLimits'
        price:
          $ref: '#/components/schemas/PublicationRevisionPrice'
        local_verification:
          $ref: '#/components/schemas/LocalVerificationEvidence'

    SignedPublicationRevisionV1:
      type: object
      additionalProperties: false
      required:
        - revision_hash
        - signer_pubkey
        - signature
        - payload
      description: >
        Provider-signed, immutable application-layer statement binding an
        existing signed offer to executable bytes, resolved limits, typed
        price terms, and successful local verification. It is deliberately
        not a Kernel artifact.
      properties:
        revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the canonical JSON payload bytes.
        signer_pubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
        signature:
          type: string
          pattern: '^[0-9a-f]{128}$'
          description: Hex BIP340 Schnorr signature over the v1 domain-separated payload.
        payload:
          $ref: '#/components/schemas/PublicationRevisionPayloadV1'

    ProviderControlPublishArtifactRequest:
      type: object
      additionalProperties: false
      description: >
        Canonical non-Kernel PublicationIntent v1 request shared by manifests,
        agent integrations, the publish engine, and this provider-control API.
        Current adapters emit `schema_version`; omission remains accepted only
        for compatibility with pre-contract direct clients. Schemas and
        `starter` guide clients but do not replace handler-side validation.
        Fee-schedule values must total a multiple of 1000 so the current
        payment APIs can represent them in whole currency minor units.
      required:
        - service_id
        - price_sats
      properties:
        schema_version:
          type: string
          const: froglet.publication-intent.v1
          description: Required for current authoring adapters; legacy direct clients may omit it.
        service_id:
          type: string
          description: Named service identifier to expose in the provider catalog.
        offer_id:
          type: string
          description: Optional offer id; defaults to `service_id`.
        project_id:
          type: string
          description: Optional project identifier retained in provider metadata.
        artifact_path:
          type: string
          description: Local artifact path for Wasm modules or Python source.
        wasm_module_hex:
          type: string
          description: Inline Wasm module bytes encoded as hex.
        inline_source:
          type: string
          description: >
            Compatibility-only raw Python source for
            `runtime=python package_kind=inline_source`. Current authoring
            adapters submit `python_bundle` instead.
        python_bundle:
          $ref: '#/components/schemas/LockedPythonBundleEnvelopeV1'
          description: >
            Current provider-private locked Python package. It is mutually
            exclusive with raw `inline_source`, data, Wasm, and OCI source
            fields and requires matching `build_evidence`.
        source_kind:
          type: string
          description: Optional informational source classification retained by the provider.
        oci_reference:
          type: string
          description: OCI image reference for `package_kind=oci_image`.
        oci_digest:
          type: string
          description: Digest pin for the OCI image.
        runtime:
          type: string
          description: Runtime hint, for example `wasm`, `python`, or `container`.
        package_kind:
          type: string
          description: Package kind, for example `inline_module`, `inline_source`, or `oci_image`.
        entrypoint_kind:
          type: string
          description: Entrypoint kind, for example `handler`, `script`, `module`, or `builtin`.
        entrypoint:
          type: string
          description: Entrypoint path or identifier.
        contract_version:
          type: string
          description: Execution contract version for the service.
        mounts:
          type: array
          description: Authoring mount handles must be unique within the intent.
          items:
            $ref: '#/components/schemas/PublicationMount'
        capabilities:
          type: array
          description: Provider-required capability strings such as `compute.gpu`.
          items:
            type: string
        data_source:
          $ref: '#/components/schemas/PublicationDataSource'
          description: >
            Typed native read-only data snapshot; mutually exclusive with
            executable artifact fields. CSV package identity binds both bytes
            and the explicit schema.
        build_evidence:
          $ref: '#/components/schemas/PublicationBuildEvidenceV1'
          description: Local builder evidence validated against the resulting package binding.
        summary:
          type: string
          description: Human-readable service summary.
        starter:
          type: string
          description: Compact JSON example input for LLM/client guidance; not stronger than `input_schema`.
        mode:
          type: string
          enum: [sync, async]
        price_sats:
          type: integer
          format: int64
          minimum: 0
          description: >
            Legacy whole-unit success amount. When `success_fee_msat` is also
            supplied it must equal `price_sats * 1000`.
        base_fee_msat:
          type: integer
          format: int64
          minimum: 0
          description: >
            Raw base leg bound into the signed offer. Divide by 1000 for the
            currency minor-unit amount shown in a Publication Revision.
        success_fee_msat:
          type: integer
          format: int64
          minimum: 0
          description: >
            Raw success leg bound into the signed offer. Divide by 1000 for
            the currency minor-unit amount shown in a Publication Revision.
        settlement_method:
          $ref: '#/components/schemas/PublicationSettlement'
        price_currency:
          $ref: '#/components/schemas/PublicationCurrency'
        limits:
          $ref: '#/components/schemas/PublicationLimits'
        publication_state:
          type: string
          enum: [active, hidden]
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        verification:
          $ref: '#/components/schemas/VerificationFixture'
      example:
        schema_version: froglet.publication-intent.v1
        service_id: echo-json
        runtime: python
        package_kind: inline_source
        entrypoint_kind: handler
        entrypoint: handler
        contract_version: froglet.python.handler_json.v1
        inline_source: "def handler(event, context):\n    return event\n"
        capabilities: []
        mode: sync
        price_sats: 0
        settlement_method: none
        price_currency: sat
        limits:
          max_input_bytes: 16384
          max_runtime_ms: 5000
          max_memory_bytes: 16777216
          max_output_bytes: 16384
          fuel_limit: 0
        verification:
          input:
            message: hello
          expected_output:
            message: hello

    ProviderControlOfferRecord:
      type: object
      description: Provider-control view of a published offer plus local binding metadata.
      properties:
        publication_state:
          type: string
          enum: [active, hidden]
        service_id:
          type: string
        project_id:
          type: string
        source_kind:
          type: string
        runtime:
          type: string
        package_kind:
          type: string
        entrypoint_kind:
          type: string
        entrypoint:
          type: string
        contract_version:
          type: string
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionMount'
        capabilities:
          type: array
          description: Provider-required capability strings such as `compute.gpu`.
          items:
            type: string
        mode:
          type: string
        summary:
          type: string
        module_hash:
          type: string
        binding_hash:
          type: string
        starter:
          type: string
          description: Compact JSON example input for LLM/client guidance; not stronger than `input_schema`.
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        offer:
          allOf:
            - $ref: '#/components/schemas/SignedArtifact'
            - type: object
              properties:
                payload:
                  $ref: '#/components/schemas/OfferPayload'

    ProviderControlMutationResponse:
      type: object
      required:
        - request_id
        - status
        - summary
        - artifacts
        - evidence
        - offer
      properties:
        request_id:
          type: string
        status:
          type: string
        failure_kind:
          type: string
        summary:
          type: string
        artifacts:
          type: array
          items:
            type: object
            required: [kind, hash]
            properties:
              kind:
                type: string
              hash:
                type: string
        evidence:
          $ref: '#/components/schemas/ProviderControlEvidence'
        offer:
          $ref: '#/components/schemas/ProviderControlOfferRecord'

    ProviderControlEvidence:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - descriptor_hash
        - offer_hash
        - offer_id
        - lifecycle_status
      properties:
        provider_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        descriptor_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        offer_id:
          type: string
        lifecycle_status:
          type: string
          enum: [active, paused, legacy_unverified]
          description: >
            Local immutable-revision lifecycle state after publication.
            `legacy_unverified` is returned only for compatibility offers that
            have no lifecycle-eligible verified revision.
        service_id:
          type: string
        local_verification:
          $ref: '#/components/schemas/LocalVerificationEvidence'
        publication_revision:
          $ref: '#/components/schemas/SignedPublicationRevisionV1'
        activation_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Opaque identifier for the exact active lifecycle instance created
            by this verified publish. Present for lifecycle-eligible publishes
            and omitted for legacy unverified compatibility offers.

    ProviderPublicationStatus:
      type: object
      additionalProperties: false
      required:
        - service_id
        - status
        - active_revision_hash
        - selected_revision_hash
        - activation_token
        - revision_count
        - created_at
        - updated_at
      properties:
        service_id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum: [active, paused, unpublished]
          description: >
            `active` exposes `selected_revision_hash`; `paused` and
            `unpublished` retain the selected rollback target but remove the
            offer from the active projection.
        active_revision_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: Exact active revision, or null unless status is active.
        selected_revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Revision selected for resume or explicit lifecycle operations.
        activation_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Opaque compare-and-swap token for the current activation instance.
            It changes on every real publish, resume, or rollback activation
            and is preserved by idempotent calls, pause, and unpublish.
        revision_count:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    ProviderPublicationRevisionSummary:
      type: object
      required:
        - revision_hash
        - service_id
        - offer_id
        - offer_hash
        - binding_hash
        - validation_status
        - created_at
      properties:
        revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        service_id:
          type: string
        offer_id:
          type: string
        offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        binding_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        validation_status:
          type: string
          enum: [validated]
        created_at:
          type: integer
          format: int64

    ProviderPublicationRevisionDetail:
      allOf:
        - $ref: '#/components/schemas/ProviderPublicationRevisionSummary'
        - type: object
          required: [signed_revision]
          properties:
            signed_revision:
              $ref: '#/components/schemas/SignedPublicationRevisionV1'

    ProviderPublicationsResponse:
      type: object
      additionalProperties: false
      required: [publications]
      properties:
        publications:
          type: array
          items:
            $ref: '#/components/schemas/ProviderPublicationStatus'

    ProviderPublicationResponse:
      type: object
      additionalProperties: false
      required: [publication]
      properties:
        publication:
          $ref: '#/components/schemas/ProviderPublicationStatus'

    ProviderPublicationRevisionsResponse:
      type: object
      additionalProperties: false
      required: [revisions]
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ProviderPublicationRevisionSummary'

    ProviderPublicationRevisionResponse:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          $ref: '#/components/schemas/ProviderPublicationRevisionDetail'

    PublicationOperationRecord:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - service_id
        - revision_hash
        - operation
        - status
        - evidence
        - created_at
      properties:
        operation_id:
          type: integer
          format: int64
        service_id:
          type: string
        revision_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        operation:
          type: string
          enum: [publish, pause, resume, rollback, unpublish]
        status:
          type: string
          enum: [succeeded]
        evidence:
          type: object
          additionalProperties: true
        created_at:
          type: integer
          format: int64

    ProviderPublicationOperationsResponse:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/PublicationOperationRecord'

    ProviderPublicationMutationResponse:
      type: object
      additionalProperties: false
      required: [operation, publication, relay_withdrawal]
      properties:
        operation:
          type: string
          enum: [pause, resume, rollback, unpublish]
        publication:
          $ref: '#/components/schemas/ProviderPublicationStatus'
        relay_withdrawal:
          $ref: '#/components/schemas/RelayWithdrawalResult'

    RelayWithdrawalResult:
      type: object
      additionalProperties: false
      required: [status, remaining_grants]
      properties:
        status:
          type: string
          enum: [reserved, shared_active]
          description: >
            `reserved` means no exact relay grant remains. `shared_active`
            means this publication was removed from the relay allowlist while
            another exact publication keeps the node tunnel connected.
        remaining_grants:
          type: integer
          minimum: 0

    RelayTransportActivationRequest:
      type: object
      additionalProperties: false
      required: [service_id, revision_hash, activation_token, public_url, relay_control_url]
      properties:
        service_id:
          type: string
          minLength: 1
          maxLength: 128
        revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        activation_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
        public_url:
          type: string
          format: uri
          pattern: '^https://'
        relay_control_url:
          type: string
          format: uri
          pattern: '^(wss://|ws://)'
          description: Exact configured relay control endpoint approved by the caller; non-TLS WS is accepted only for literal loopback development endpoints.

    PublicationTransportGrant:
      type: object
      additionalProperties: false
      required:
        - transport
        - service_id
        - revision_hash
        - offer_id
        - offer_hash
        - activation_token
        - public_url
        - relay_control_url
        - created_at
        - updated_at
      properties:
        transport:
          type: string
          const: relay
        service_id:
          type: string
        revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        offer_id:
          type: string
        offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        activation_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
        public_url:
          type: string
          format: uri
        relay_control_url:
          type: string
          format: uri
          description: Exact control endpoint this durable authorization permits the node to dial.
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    RelayTransportActivationResponse:
      type: object
      additionalProperties: false
      required: [status, public_url, grant, remaining_grants]
      properties:
        status:
          type: string
          const: up
        public_url:
          type: string
          format: uri
        grant:
          $ref: '#/components/schemas/PublicationTransportGrant'
        remaining_grants:
          type: integer
          minimum: 1

    RelayTransportDeactivationResponse:
      type: object
      additionalProperties: false
      required: [status, public_url, grant_removed, remaining_grants]
      properties:
        status:
          type: string
          enum: [reserved, up]
        public_url:
          type: string
          format: uri
        grant_removed:
          type: boolean
        remaining_grants:
          type: integer
          minimum: 0

    ExactPublicationPauseRequest:
      type: object
      additionalProperties: false
      required: [activation_token]
      properties:
        activation_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Token returned for the exact revision activation being
            compensated. A stale token fails with 409 and cannot pause a later
            activation of the same revision.

    PublicationCanaryRequestV1:
      type: object
      additionalProperties: false
      required: [schema_version, revision_hash, offer_hash, challenge, input]
      properties:
        schema_version:
          type: string
          const: froglet.publication-canary-request.v1
        revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        challenge:
          type: string
          pattern: '^[0-9a-f]{64}$'
        input:
          description: Exact private canary input previously hash-bound by local verification.

    PublicationCanaryResultPayloadV1:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - provider_id
        - revision_hash
        - offer_hash
        - challenge
        - input_hash
        - result_hash
        - status
      properties:
        schema_version:
          type: string
          const: froglet.publication-canary-result.v1
        provider_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
        revision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        offer_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        challenge:
          type: string
          pattern: '^[0-9a-f]{64}$'
        input_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        result_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          type: string
          const: succeeded

    SignedPublicationCanaryResultV1:
      type: object
      additionalProperties: false
      required: [payload_hash, signer_pubkey, signature, payload]
      properties:
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        signer_pubkey:
          type: string
          pattern: '^[0-9a-f]{64}$'
        signature:
          type: string
          pattern: '^[0-9a-f]{128}$'
        payload:
          $ref: '#/components/schemas/PublicationCanaryResultPayloadV1'

    WorkloadSpec:
      type: object
      description: >
        Polymorphic workload specification used in quote and deal requests.
        Discriminated by the `kind` field. The most common variants are shown;
        all variants are tagged with `"kind"` in the serialized JSON.
      required:
        - kind
      discriminator:
        propertyName: kind
      properties:
        kind:
          type: string
          description: Workload variant discriminator.
          enum:
            - execution
            - wasm
            - oci_wasm
            - confidential_service
            - attested_wasm
            - events_query
      oneOf:
        - title: Execution workload
          type: object
          required: [kind, execution]
          properties:
            kind:
              type: string
              enum: [execution]
            execution:
              type: object
              description: >
                Describes a Python, container, WASM, or builtin execution.
                The full `ExecutionWorkload` struct fields depend on runtime.
              additionalProperties: true
        - title: WASM submission
          type: object
          required: [kind, submission]
          properties:
            kind:
              type: string
              enum: [wasm]
            submission:
              type: object
              description: Inline WASM module bytes (hex) plus input value.
              properties:
                schema_version:
                  type: string
                submission_type:
                  type: string
                workload:
                  type: object
                  additionalProperties: true
                module_bytes_hex:
                  type: string
                input:
                  type: object
                  additionalProperties: true
        - title: OCI WASM workload
          type: object
          required: [kind, submission]
          properties:
            kind:
              type: string
              enum: [oci_wasm]
            submission:
              type: object
              description: OCI image reference for a WASM module.
              properties:
                schema_version:
                  type: string
                submission_type:
                  type: string
                workload:
                  type: object
                  additionalProperties: true
                input:
                  type: object
                  additionalProperties: true
        - title: Events query
          type: object
          required: [kind, kinds]
          properties:
            kind:
              type: string
              enum: [events_query]
            kinds:
              type: array
              items:
                type: string
              description: Event kind strings to query.
            limit:
              type: integer
              description: Maximum number of events to return.
        - title: Confidential service
          type: object
          required: [kind, confidential_session_hash, service_id, request_envelope]
          properties:
            kind:
              type: string
              enum: [confidential_service]
            confidential_session_hash:
              type: string
            service_id:
              type: string
            request_envelope:
              type: object
              description: Encrypted request envelope for the confidential session.
              additionalProperties: true

    ProvidedPayment:
      type: object
      description: >
        Pre-provided payment token for local token-settled endpoints. Active
        payment kinds are `stripe_mpp` and `x402_usdc`. Lightning-priced work
        uses the signed quote/deal invoice-bundle flow instead of this object.
      required:
        - kind
        - token
      properties:
        kind:
          type: string
          description: Payment method kind.
          example: x402_usdc
        token:
          type: string
          description: >
            Opaque payment token issued by the payment backend, for example an
            x402 payment payload or Stripe Shared Payment Token id.

    StripeWebhookResponse:
      type: object
      description: Result of accepting a Stripe webhook event.
      required:
        - status
        - event_id
        - event_type
        - duplicate
        - processed
      properties:
        status:
          type: string
          example: ok
        event_id:
          type: string
          example: evt_test_123
        event_type:
          type: string
          example: payment_intent.succeeded
        object_id:
          type: string
          nullable: true
          example: pi_test_123
        payment_intent_id:
          type: string
          nullable: true
          example: pi_test_123
        duplicate:
          type: boolean
          description: True when this Stripe event id was already recorded.
        processed:
          type: boolean
          description: True when this request inserted a new event record.

    NodeEventEnvelope:
      type: object
      description: >
        Signed node event. Structure mirrors NIP-01 Nostr events but uses
        froglet-specific kinds and is signed with the node's BIP340 Schnorr key.
      required:
        - id
        - pubkey
        - created_at
        - kind
        - tags
        - content
        - sig
      properties:
        id:
          type: string
          description: Hex SHA-256 event ID computed over the canonical event fields.
        pubkey:
          type: string
          description: Hex x-only secp256k1 public key of the signing node.
        created_at:
          type: integer
          format: int64
        kind:
          type: string
          description: Event kind string (e.g. `froglet.deal.created`).
        tags:
          type: array
          items:
            type: array
            items:
              type: string
        content:
          type: string
          description: Event content (often a JSON-serialized payload).
        sig:
          type: string
          description: BIP340 Schnorr signature (hex) over the canonical signing bytes.

    ConfidentialProfilePayload:
      type: object
      description: >
        TEE service profile. Describes the attestation platform, measurement,
        and encryption parameters for a confidential execution environment.
      required:
        - provider_id
        - profile_id
        - service_class
        - allowed_workload_kind
        - execution_mode
        - attestation_platform
        - measurement
        - key_release_policy_hash
        - input_encryption_algorithm
        - output_encryption_algorithm
        - max_input_bytes
        - max_runtime_ms
        - max_output_bytes
      properties:
        provider_id:
          type: string
        profile_id:
          type: string
        service_class:
          type: string
        allowed_workload_kind:
          type: string
        execution_mode:
          type: string
        attestation_platform:
          type: string
          example: nvidia_hopper
        measurement:
          type: string
          description: Hex-encoded platform measurement (PCR values or equivalent).
        key_release_policy_hash:
          type: string
        input_encryption_algorithm:
          type: string
          example: x25519-xsalsa20-poly1305
        output_encryption_algorithm:
          type: string
        service_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        max_input_bytes:
          type: integer
        max_runtime_ms:
          type: integer
          format: int64
        max_output_bytes:
          type: integer

    ConfidentialSessionPayload:
      type: object
      description: >
        TEE session payload. Binds a requester public key to a provider TEE
        session, enabling encrypted input/output exchange.
      required:
        - provider_id
        - requester_id
        - session_id
        - confidential_profile_hash
        - allowed_workload_kind
        - execution_mode
        - attestation_platform
        - measurement
        - attestation_evidence_hash
        - key_release_policy_hash
        - session_public_key
        - requester_public_key
        - encryption_algorithm
        - expires_at
      properties:
        provider_id:
          type: string
        requester_id:
          type: string
        session_id:
          type: string
        confidential_profile_hash:
          type: string
        allowed_workload_kind:
          type: string
        execution_mode:
          type: string
        attestation_platform:
          type: string
        measurement:
          type: string
        attestation_evidence_hash:
          type: string
        key_release_policy_hash:
          type: string
        session_public_key:
          type: string
          description: Ephemeral public key for this session (curve25519 hex).
        requester_public_key:
          type: string
          description: Requester-provided curve25519 public key for response encryption.
        encryption_algorithm:
          type: string
          example: x25519-xsalsa20-poly1305
        expires_at:
          type: integer
          format: int64

    AttestationBundle:
      type: object
      description: >
        Raw TEE attestation evidence bundle. Passed alongside the session
        artifact so requesters can independently verify the TEE measurement.
      required:
        - schema_version
        - platform
        - backend
        - measurement
        - session_public_key
        - key_release_policy_hash
        - issued_at
        - expires_at
        - claims
      properties:
        schema_version:
          type: string
        platform:
          type: string
        backend:
          type: string
        measurement:
          type: string
        session_public_key:
          type: string
        key_release_policy_hash:
          type: string
        issued_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        claims:
          type: object
          description: Platform-specific attestation claims (JSON).
          additionalProperties: true

    CuratedListPayload:
      type: object
      description: >
        A curator-signed list of trusted provider IDs. Used to bootstrap
        trust in a network without a central registry.
      additionalProperties: true

paths:

  # ---------------------------------------------------------------------------
  # Hosted trial endpoints (try.froglet.dev worker -> public origin)
  # ---------------------------------------------------------------------------

  /api/preflight:
    get:
      operationId: getHostedTrialPreflight
      summary: Hosted trial agent preflight
      description: >
        Returns the client capabilities, authorized scope, and demo-service
        boundary required to run the public hosted proof. This endpoint is
        intended for LLM and MCP clients before they mint a session token.
        It does not require a session bearer token, but public origin
        deployments may gate it behind the hosted-trial worker/origin secret.
      tags: [Hosted Trial]
      security: []
      responses:
        '200':
          description: Hosted trial preflight metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - public_ingress
                  - session_pool
                  - authorized_scope
                  - required_client_capabilities
                  - public_hosted_proof_services
                  - non_demo_services
                  - chat_only_fallback
                properties:
                  service:
                    type: string
                    example: froglet-hosted-trial
                  public_ingress:
                    type: string
                    format: uri
                    example: https://try.froglet.dev
                  session_pool:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
                      size:
                        type: integer
                        nullable: true
                      ttl_secs:
                        type: integer
                        nullable: true
                  authorized_scope:
                    type: object
                    required: [hosts, methods, paths, rules]
                    properties:
                      hosts:
                        type: array
                        items:
                          type: string
                      methods:
                        type: array
                        items:
                          type: string
                      paths:
                        type: array
                        items:
                          type: string
                      rules:
                        type: array
                        items:
                          type: string
                  required_client_capabilities:
                    type: object
                    required: [https_get, https_post_json, custom_headers, polling]
                    properties:
                      https_get:
                        type: boolean
                      https_post_json:
                        type: boolean
                      custom_headers:
                        type: array
                        items:
                          type: string
                      polling:
                        type: boolean
                  public_hosted_proof_services:
                    type: array
                    items:
                      type: string
                    example:
                      - demo.add
                      - demo.echo
                      - demo.fetch-witness
                      - demo.hash-verify
                      - demo.notarize
                  non_demo_services:
                    type: string
                  chat_only_fallback:
                    type: string

  # ---------------------------------------------------------------------------
  # Common endpoints (both ports)
  # ---------------------------------------------------------------------------

  /health:
    get:
      operationId: getHealth
      summary: Node health check
      description: >
        Returns a static `{"status":"ok","service":"froglet"}` body.
        Suitable for use as a liveness probe.
      tags: [Common]
      security: []
      responses:
        '200':
          description: Node is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: froglet

  /v1/node/capabilities:
    get:
      operationId: getNodeCapabilities
      summary: Node capabilities advertisement
      description: >
        Returns the full capability set of this node: version, identity,
        transport endpoints, execution runtimes, resource limits, payment
        backend, and FaaS features. Requesters use this to decide whether a
        node is compatible with their workload.
      tags: [Common]
      security: []
      responses:
        '200':
          description: Capability advertisement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeCapabilities'

  /v1/node/identity:
    get:
      operationId: getNodeIdentity
      summary: Node identity
      description: Returns the node's stable identifier and x-only secp256k1 public key.
      tags: [Common]
      security: []
      responses:
        '200':
          description: Node identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityInfo'

  /v1/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: OpenAPI specification
      description: >
        Returns the OpenAPI specification for this node's API. The spec is
        served as YAML from the same source embedded in the running binary.
        Use this endpoint to discover the exact schema supported by a node.
      tags: [Common]
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 specification document.
          content:
            application/x-yaml:
              schema:
                type: string

  # ---------------------------------------------------------------------------
  # Catalog — Provider port
  # ---------------------------------------------------------------------------

  /v1/provider/descriptor:
    get:
      operationId: getProviderDescriptor
      summary: Provider descriptor
      description: >
        Returns the signed descriptor artifact for this provider. The descriptor
        contains the provider's identity, transport endpoints, and capability
        advertisement. Requesters should verify the artifact signature before
        trusting any of its fields.
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Signed descriptor artifact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignedArtifact'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/DescriptorPayload'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/provider/offers:
    get:
      operationId: listProviderOffers
      summary: List active offers
      description: >
        Returns all signed offer artifacts currently published by this provider.
        Only `active` offers are returned by default. Each offer specifies a
        priced execution profile that requesters can reference in quote requests.
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: Array of signed offer artifacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/SignedArtifact'
                    - type: object
                      properties:
                        payload:
                          $ref: '#/components/schemas/OfferPayload'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/services:
    get:
      operationId: listProviderServices
      summary: List provider services
      description: >
        Returns a structured catalog of named services hosted by this provider.
        Services are a higher-level abstraction over offers, including human-
        readable summaries, input/output schemas, and publication state.
      tags: [Catalog]
      security: []
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderServiceRecord'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/services/{service_id}:
    get:
      operationId: getProviderService
      summary: Get a single provider service
      description: Returns the full record for a specific named service.
      tags: [Catalog]
      security: []
      parameters:
        - name: service_id
          in: path
          required: true
          description: The service identifier (e.g. `service.echo`).
          schema:
            type: string
      responses:
        '200':
          description: Single service record.
          content:
            application/json:
              schema:
                type: object
                required: [service]
                properties:
                  service:
                    $ref: '#/components/schemas/ProviderServiceRecord'
        '404':
          description: Service not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # ---------------------------------------------------------------------------
  # Deals — Provider port
  # ---------------------------------------------------------------------------

  /v1/provider/quotes:
    post:
      operationId: createQuote
      summary: Create a quote
      description: >
        The requester sends a quote request specifying the offer, their node ID,
        and the workload. The provider validates the workload, checks resource
        limits and pricing, and returns a signed `quote` artifact that can be
        used to open a deal. Quotes expire at the `expires_at` timestamp in the
        payload.
      tags: [Deals (Provider)]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - offer_id
                - requester_id
                - kind
              properties:
                offer_id:
                  type: string
                  description: The offer to quote against (e.g. `service.echo`).
                  example: service.echo
                requester_id:
                  type: string
                  description: The requester's node ID (hex x-only secp256k1 public key).
                max_price_sats:
                  type: integer
                  format: int64
                  description: >
                    Optional ceiling on the total price (base + success fee) in
                    satoshis. The provider will reject the quote if its price
                    exceeds this value.
              allOf:
                - $ref: '#/components/schemas/WorkloadSpec'
      responses:
        '200':
          description: Signed quote artifact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignedArtifact'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/QuotePayload'
        '400':
          description: Invalid request body or workload spec.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/deals:
    post:
      operationId: createDeal
      summary: Create a deal
      description: >
        The requester submits a signed `deal` artifact alongside the previously
        obtained signed `quote` and the workload spec. The provider verifies
        both artifacts, checks that the deal payment hash is consistent, and
        begins execution (or queues a payment step for Lightning settlement).
        Returns a `DealRecord` with the initial status.
      tags: [Deals (Provider)]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quote
                - deal
                - kind
              properties:
                quote:
                  $ref: '#/components/schemas/SignedArtifact'
                  description: The signed quote artifact obtained from `POST /v1/provider/quotes`.
                deal:
                  $ref: '#/components/schemas/SignedArtifact'
                  description: The requester-signed deal artifact.
                idempotency_key:
                  type: string
                  description: >
                    Optional idempotency key (max 128 bytes). If a deal with this
                    key already exists for the same requester, the existing deal
                    record is returned instead of creating a new one.
                payment:
                  $ref: '#/components/schemas/ProvidedPayment'
              allOf:
                - $ref: '#/components/schemas/WorkloadSpec'
      responses:
        '200':
          description: Deal record (may be new or idempotently returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealRecord'
        '400':
          description: Invalid deal or quote artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/deals/{deal_id}:
    get:
      operationId: getDealStatus
      summary: Get provider deal status
      description: >
        Returns the current `DealRecord` for a deal submitted to this provider.
        Poll this endpoint to observe status transitions. When `status` is
        `result_ready` or `succeeded` the `result` and `receipt` fields are
        populated.
      tags: [Deals (Provider)]
      security: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: The deal identifier (artifact hash of the `deal` artifact).
          schema:
            type: string
      responses:
        '200':
          description: Deal record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealRecord'
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Settlement — Provider port
  # ---------------------------------------------------------------------------

  /v1/provider/deals/{deal_id}/accept:
    post:
      operationId: releaseDealPreimage
      summary: Release the Lightning preimage (provider accept)
      description: >
        The requester calls this after confirming the result. Supplying the
        `success_preimage` allows the provider to settle the success-fee invoice.
        Optionally the requester can supply `expected_result_hash` for the
        provider to verify before releasing.
      tags: [Settlement (Provider)]
      security: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - success_preimage
              properties:
                success_preimage:
                  type: string
                  description: Hex-encoded 32-byte preimage whose SHA-256 matches the `success_payment_hash` in the deal.
                expected_result_hash:
                  type: string
                  description: >
                    Optional SHA-256 of the expected result. If supplied, the
                    provider will verify the actual result hash matches before
                    releasing the preimage.
      responses:
        '200':
          description: Deal updated; preimage released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealRecord'
        '400':
          description: Invalid preimage or result hash mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/deals/{deal_id}/mock-pay:
    post:
      operationId: mockPayDeal
      summary: Mock-pay a deal (test only)
      description: >
        Simulates Lightning payment on both invoice bundle legs. Only available
        when the node is running in `mock_hold_invoice` payment mode. Used in
        integration tests and local development to advance deals without a real
        Lightning node.
      tags: [Settlement (Provider)]
      security: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - success_preimage
              properties:
                success_preimage:
                  type: string
                  description: Hex-encoded 32-byte preimage to settle the success-fee invoice.
      responses:
        '200':
          description: Deal record after mock payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealRecord'
        '400':
          description: Mock payment not available or invalid preimage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/deals/{deal_id}/invoice-bundle:
    get:
      operationId: getDealInvoiceBundle
      summary: Get the Lightning invoice bundle for a deal
      description: >
        Returns the signed `invoice_bundle` artifact for a deal that uses
        Lightning settlement. Contains two BOLT-11 hold invoices: `base_fee`
        (must be paid before execution) and `success_fee` (settled on success
        by the requester releasing the preimage).
      tags: [Settlement (Provider)]
      security: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier.
          schema:
            type: string
      responses:
        '200':
          description: Signed invoice bundle artifact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignedArtifact'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/InvoiceBundlePayload'
        '404':
          description: Deal or invoice bundle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/invoice-bundles/verify:
    post:
      operationId: verifyInvoiceBundle
      summary: Verify an invoice bundle artifact
      description: >
        Verifies the signature on an invoice bundle artifact and validates that
        it is correctly bound to the provided quote and deal artifacts. Returns
        a report listing any validation issues found.
      tags: [Settlement (Provider)]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bundle
                - quote
                - deal
              properties:
                bundle:
                  $ref: '#/components/schemas/SignedArtifact'
                  description: The signed invoice bundle artifact to verify.
                quote:
                  $ref: '#/components/schemas/SignedArtifact'
                  description: The signed quote artifact the bundle is bound to.
                deal:
                  $ref: '#/components/schemas/SignedArtifact'
                  description: The signed deal artifact the bundle is bound to.
                requester_id:
                  type: string
                  description: >
                    Optional requester ID to verify. If omitted, the check is
                    skipped.
      responses:
        '200':
          description: Verification report.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - bundle_hash
                  - quote_hash
                  - deal_hash
                  - issues
                properties:
                  valid:
                    type: boolean
                  bundle_hash:
                    type: string
                  quote_hash:
                    type: string
                  deal_hash:
                    type: string
                  expected_requester_id:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/receipts/verify:
    post:
      operationId: verifyReceipt
      summary: Verify a receipt artifact
      description: >
        Verifies the BIP340 Schnorr signature and semantic integrity of a `receipt`
        SignedArtifact. Returns a simple `{valid: bool}` response plus any
        validation issues.
      tags: [Settlement (Provider)]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receipt
              properties:
                receipt:
                  $ref: '#/components/schemas/SignedArtifact'
                  description: The signed receipt artifact to verify.
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Events
  # ---------------------------------------------------------------------------

  /v1/node/events/publish:
    post:
      operationId: publishEvent
      summary: Publish a signed node event
      description: >
        Stores a signed node event in the local event ledger. The event must be
        signed by the local node key. Maximum content size is 64 KiB. Events
        are retrievable via `POST /v1/node/events/query`.
      tags: [Events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  $ref: '#/components/schemas/NodeEventEnvelope'
      responses:
        '200':
          description: Event accepted and stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          description: Invalid event signature or malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/node/events/query:
    post:
      operationId: queryEvents
      summary: Query node events
      description: >
        Returns stored node events matching the requested `kinds`. Results are
        ordered by `created_at` descending. The default page size is 100 and
        the hard maximum is 500.
      tags: [Events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kinds
              properties:
                kinds:
                  type: array
                  items:
                    type: string
                  description: >
                    Event kind strings to filter by (maximum 100 kinds per request).
                  example: ["froglet.deal.created", "froglet.deal.succeeded"]
                limit:
                  type: integer
                  description: Maximum number of events to return (default 100, max 500).
                payment:
                  $ref: '#/components/schemas/ProvidedPayment'
                  description: Optional payment token if the provider charges for queries.
      responses:
        '200':
          description: Matching events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeEventEnvelope'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/webhooks/stripe:
    post:
      operationId: stripeWebhook
      summary: Receive Stripe webhook event
      description: >
        Public Stripe webhook receiver for local/self-hosted Stripe MPP nodes.
        The route requires `FROGLET_STRIPE_WEBHOOK_SECRET`, verifies the raw
        request body against the `Stripe-Signature` header, and records each
        Stripe event id once so retries are idempotent. Use an HTTPS URL in
        Stripe test or live mode.
      tags: [Settlement]
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
          description: Stripe webhook signature header (`t=...,v1=...`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or duplicate event ignored idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeWebhookResponse'
        '400':
          description: Missing/invalid signature or malformed event payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stripe webhook receiver is not configured on this node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/curated-lists/verify:
    post:
      operationId: verifyCuratedList
      summary: Verify a curated list artifact
      description: >
        Verifies the signature and structure of a curator-signed list of
        provider IDs. Returns the list hash, curator identity, and expiry.
      tags: [Events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - curated_list
              properties:
                curated_list:
                  $ref: '#/components/schemas/SignedArtifact'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - list_hash
                  - curator_id
                  - list_id
                  - expires_at
                properties:
                  valid:
                    type: boolean
                  list_hash:
                    type: string
                  curator_id:
                    type: string
                  list_id:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/nostr/events/verify:
    post:
      operationId: verifyNostrEvent
      summary: Verify a Nostr event
      description: >
        Verifies the BIP-340 Schnorr signature on a Nostr event and validates
        the event ID. Returns the event ID, pubkey, and kind on success.
      tags: [Events]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
              properties:
                event:
                  type: object
                  description: A NIP-01 Nostr event object.
                  additionalProperties: true
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - event_id
                  - pubkey
                  - kind
                properties:
                  valid:
                    type: boolean
                  event_id:
                    type: string
                  pubkey:
                    type: string
                  kind:
                    type: integer
                    format: int32
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Execution — Runtime port (runtime bearer auth required)
  # ---------------------------------------------------------------------------

  /v1/node/execute/wasm:
    post:
      operationId: executeWasm
      summary: Execute a WASM module synchronously
      description: >
        Submits an inline WASM module (hex-encoded) with input for immediate
        execution. Blocks until execution completes or the per-node timeout
        elapses. Maximum module size is 512 KiB (hex). Maximum input is 128 KiB
        (hex). Only available on the runtime port and requires runtime bearer
        authentication.
      tags: [Execution]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - submission
              properties:
                submission:
                  type: object
                  description: WASM submission details.
                  required:
                    - schema_version
                    - submission_type
                    - workload
                    - module_bytes_hex
                  properties:
                    schema_version:
                      type: string
                    submission_type:
                      type: string
                    workload:
                      type: object
                      additionalProperties: true
                    module_bytes_hex:
                      type: string
                      description: Hex-encoded WASM module bytes. Max 512 KiB hex.
                    input:
                      type: object
                      additionalProperties: true
                      description: Input value passed to the WASM entrypoint.
                payment:
                  $ref: '#/components/schemas/ProvidedPayment'
      responses:
        '200':
          description: Execution result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Concurrency limit reached; try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Execution error or internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/node/jobs:
    post:
      operationId: createJob
      summary: Create an async job
      description: >
        Enqueues an async job. Supported job kinds: `wasm` (inline module),
        `oci_wasm` (OCI image reference), and `execution` (arbitrary execution
        workload). The job ID is returned immediately; poll
        `GET /v1/node/jobs/{job_id}` for status.
        An optional `idempotency_key` ensures at-most-once creation.
        Priced async jobs do not currently support token-based settlement:
        Lightning-priced work must use the signed quote/deal flow, and
        Stripe/x402 paid work must use synchronous `/v1/node/events/query` or
        `/v1/node/execute/wasm` until durable async payment reservations are
        implemented. Requires runtime bearer authentication.
      tags: [Execution]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum: [wasm, oci_wasm, execution]
                  description: Job variant discriminator.
                idempotency_key:
                  type: string
                  description: >
                    Optional idempotency key (max 128 bytes). Repeated requests
                    with the same key return the existing job.
                payment:
                  $ref: '#/components/schemas/ProvidedPayment'
                  description: >
                    Reserved for future paid async-job support. Current priced
                    async jobs are rejected before payment reservation.
              additionalProperties: true
              description: >
                Additional fields depend on `kind`. For `wasm` include a
                `submission` object; for `execution` include an `execution`
                object. See `WorkloadSpec` variants for details.
      responses:
        '200':
          description: Created (or idempotently returned) job record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRecord'
        '400':
          description: Invalid job specification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/node/jobs/{job_id}:
    get:
      operationId: getJobStatus
      summary: Poll async job status
      description: >
        Returns the current state of an async job. When `status` is `succeeded`,
        the `result` field contains the execution output. When `status` is
        `failed`, the `error` field is populated. Requires runtime bearer
        authentication.
      tags: [Execution]
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: Hex job identifier returned by `POST /v1/node/jobs`.
          schema:
            type: string
      responses:
        '200':
          description: Job record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRecord'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Deals — Runtime port
  # ---------------------------------------------------------------------------

  /v1/runtime/deals:
    post:
      operationId: runtimeCreateDeal
      summary: Create an outbound deal via a provider
      description: >
        Orchestrates the full quote-and-deal flow against a remote provider:
        fetches the descriptor, obtains a quote, builds and signs the deal
        artifact, and submits it to the provider. Returns the signed quote and
        the resulting `RequesterDealRecord`. If Lightning settlement is required,
        a `payment_intent` is included with the invoices to pay.
      tags: [Deals (Runtime)]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - offer_id
                - kind
              properties:
                provider:
                  type: object
                  description: Provider reference. Supply at least one of `provider_id` or `provider_url`.
                  properties:
                    provider_id:
                      type: string
                      description: Provider node ID. Required if `provider_url` is omitted.
                    provider_url:
                      type: string
                      description: Direct URL of the provider's provider-port API.
                offer_id:
                  type: string
                  description: The offer to use (e.g. `service.echo`).
                max_price_sats:
                  type: integer
                  format: int64
                  description: >
                    Optional price ceiling in satoshis. The deal is aborted if
                    the provider's quote exceeds this amount.
                idempotency_key:
                  type: string
                  description: Optional idempotency key (max 128 bytes).
                payment:
                  $ref: '#/components/schemas/ProvidedPayment'
              allOf:
                - $ref: '#/components/schemas/WorkloadSpec'
      responses:
        '200':
          description: Deal created. Includes quote, deal record, and optional payment intent.
          content:
            application/json:
              schema:
                type: object
                required:
                  - provider_id
                  - provider_url
                  - quote
                  - deal
                properties:
                  provider_id:
                    type: string
                  provider_url:
                    type: string
                  quote:
                    $ref: '#/components/schemas/SignedArtifact'
                  deal:
                    $ref: '#/components/schemas/RequesterDealRecord'
                  payment_intent_path:
                    type: string
                    description: Relative path to poll for the payment intent.
                  payment_intent:
                    $ref: '#/components/schemas/LightningWalletIntent'
        '400':
          description: Invalid request or provider resolution failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream provider error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/runtime/deals/{deal_id}:
    get:
      operationId: runtimeGetDeal
      summary: Get outbound deal status
      description: >
        Fetches the latest state of an outbound deal by syncing with the
        remote provider. Verifies the provider's receipt signature before
        updating the local state. Returns the `RequesterDealRecord`.
      tags: [Deals (Runtime)]
      security:
        - BearerAuth: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier (artifact hash of the requester-signed deal).
          schema:
            type: string
      responses:
        '200':
          description: Requester deal record.
          content:
            application/json:
              schema:
                type: object
                required: [deal]
                properties:
                  deal:
                    $ref: '#/components/schemas/RequesterDealRecord'
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream provider error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/runtime/archive/{subject_kind}/{subject_id}:
    get:
      operationId: runtimeArchiveSubject
      summary: Export artifact archive for a deal or job
      description: >
        Exports a full cryptographic archive for a deal or job, including all
        signed artifacts, feed entries, execution evidence records, and Lightning
        invoice bundles. Useful for auditing and dispute resolution.
      tags: [Deals (Runtime)]
      security:
        - BearerAuth: []
      parameters:
        - name: subject_kind
          in: path
          required: true
          description: Archive subject type. One of `deal`, `job`.
          schema:
            type: string
            enum: [deal, job]
        - name: subject_id
          in: path
          required: true
          description: The deal ID or job ID to archive.
          schema:
            type: string
      responses:
        '200':
          description: Archive export.
          content:
            application/json:
              schema:
                type: object
                required:
                  - schema_version
                  - export_type
                  - subject_kind
                  - subject_id
                  - exported_at
                  - artifact_documents
                  - artifact_feed
                  - execution_evidence
                  - lightning_invoice_bundles
                properties:
                  schema_version:
                    type: string
                  export_type:
                    type: string
                  subject_kind:
                    type: string
                  subject_id:
                    type: string
                  exported_at:
                    type: integer
                    format: int64
                  artifact_documents:
                    type: array
                    items:
                      type: object
                      properties:
                        artifact_hash:
                          type: string
                        payload_hash:
                          type: string
                        artifact_kind:
                          type: string
                        actor_id:
                          type: string
                        created_at:
                          type: integer
                          format: int64
                        document:
                          $ref: '#/components/schemas/SignedArtifact'
                  artifact_feed:
                    type: array
                    items:
                      type: object
                      properties:
                        sequence:
                          type: integer
                          format: int64
                        artifact_hash:
                          type: string
                        observed_at:
                          type: integer
                          format: int64
                  execution_evidence:
                    type: array
                    items:
                      type: object
                      properties:
                        evidence_id:
                          type: integer
                          format: int64
                        subject_kind:
                          type: string
                        subject_id:
                          type: string
                        evidence_kind:
                          type: string
                        content_hash:
                          type: string
                        created_at:
                          type: integer
                          format: int64
                        content:
                          type: object
                          additionalProperties: true
                  lightning_invoice_bundles:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                        bundle:
                          $ref: '#/components/schemas/SignedArtifact'
                        base_state:
                          type: string
                        success_state:
                          type: string
                        created_at:
                          type: integer
                          format: int64
                        updated_at:
                          type: integer
                          format: int64
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Subject not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Discovery — Runtime port
  # ---------------------------------------------------------------------------

  /v1/runtime/search:
    post:
      operationId: runtimeSearch
      summary: Search the marketplace for providers and offers
      description: >
        Searches the configured marketplace. Requires
        `FROGLET_MARKETPLACE_URL` to be set. REST marketplaces are queried
        through `/v1/offers` and `/v1/providers`; older Froglet-native
        marketplace service deployments may still be reached through the
        `marketplace.search` deal flow.
      tags: [Discovery (Runtime)]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offer_kind:
                  type: string
                  description: Filter by offer kind (e.g. `compute.execution.v1`).
                runtime:
                  type: string
                  description: Filter by execution runtime (e.g. `python`, `wasm`).
                limit:
                  type: integer
                  description: Maximum number of results (default 20).
      responses:
        '200':
          description: Search results (structure determined by marketplace).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No marketplace URL configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Marketplace request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/runtime/providers/{provider_id}:
    get:
      operationId: runtimeGetProviderDetails
      summary: Get provider details via marketplace
      description: >
        Fetches descriptor and offer details for a specific provider through
        the configured marketplace. Requires `FROGLET_MARKETPLACE_URL`.
        REST marketplaces are queried through `/v1/providers/{provider_id}`
        and `/v1/offers`; older Froglet-native marketplace service deployments
        may still be reached through the `marketplace.provider` deal flow.
      tags: [Discovery (Runtime)]
      security:
        - BearerAuth: []
      parameters:
        - name: provider_id
          in: path
          required: true
          description: Provider node ID (hex x-only secp256k1 public key).
          schema:
            type: string
      responses:
        '200':
          description: Provider descriptor and offer list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No marketplace URL configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Marketplace request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Settlement — Runtime port
  # ---------------------------------------------------------------------------

  /v1/runtime/wallet/balance:
    get:
      operationId: getRuntimeWalletBalance
      summary: Get wallet balance snapshot
      description: >
        Returns the current Lightning wallet balance and payment-backend status.
        `balance_known` will be `false` if the backend cannot report a balance
        (e.g. in mock mode or when the LND connection is down).
      tags: [Settlement (Runtime)]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet balance snapshot.
          content:
            application/json:
              schema:
                type: object
                required:
                  - backend
                  - mode
                  - balance_known
                  - accepted_payment_methods
                  - reservations
                  - receipts
                properties:
                  backend:
                    type: string
                    example: lightning
                  mode:
                    type: string
                    example: lnd_rest
                  balance_known:
                    type: boolean
                  balance_sats:
                    type: integer
                    format: int64
                    description: Present when `balance_known` is true.
                  accepted_payment_methods:
                    type: array
                    items:
                      type: string
                  reservations:
                    type: boolean
                  receipts:
                    type: boolean
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/runtime/deals/{deal_id}/payment-intent:
    get:
      operationId: getRuntimeDealPaymentIntent
      summary: Get Lightning payment intent for an outbound deal
      description: >
        Returns the current `LightningWalletIntent` for an outbound deal.
        Call this to obtain invoice details, check payment state, and determine
        whether the preimage can be released. Poll this endpoint as invoices
        are paid to observe state transitions.
      tags: [Settlement (Runtime)]
      security:
        - BearerAuth: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier.
          schema:
            type: string
      responses:
        '200':
          description: Payment intent.
          content:
            application/json:
              schema:
                type: object
                required: [payment_intent]
                properties:
                  payment_intent:
                    $ref: '#/components/schemas/LightningWalletIntent'
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal or invoice bundle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/runtime/deals/{deal_id}/mock-pay:
    post:
      operationId: runtimeMockPayDeal
      summary: Mock-pay an outbound deal (test only)
      description: >
        Simulates Lightning payment for an outbound deal on the runtime side.
        Only functional in `mock_hold_invoice` mode. Triggers the provider's
        mock-pay endpoint and returns the updated deal and payment intent.
      tags: [Settlement (Runtime)]
      security:
        - BearerAuth: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Empty body accepted; no fields required for mock payment.
      responses:
        '200':
          description: Updated deal record and payment intent.
          content:
            application/json:
              schema:
                type: object
                required: [deal]
                properties:
                  deal:
                    $ref: '#/components/schemas/RequesterDealRecord'
                  payment_intent_path:
                    type: string
                  payment_intent:
                    $ref: '#/components/schemas/LightningWalletIntent'
        '400':
          description: Mock payment not available or deal in wrong state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/runtime/deals/{deal_id}/accept:
    post:
      operationId: runtimeAcceptDeal
      summary: Accept an outbound deal (release preimage)
      description: >
        Releases the success preimage to the provider, finalizing the
        Lightning success-fee settlement. Call this after verifying the deal
        result to your satisfaction. Optionally supply `expected_result_hash`
        as an additional safety check.
      tags: [Settlement (Runtime)]
      security:
        - BearerAuth: []
      parameters:
        - name: deal_id
          in: path
          required: true
          description: Deal identifier.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_result_hash:
                  type: string
                  description: >
                    Optional SHA-256 hash of the expected result. If supplied,
                    the runtime verifies the actual result hash matches before
                    releasing the preimage.
      responses:
        '200':
          description: Deal accepted; preimage released.
          content:
            application/json:
              schema:
                type: object
                required: [deal]
                properties:
                  deal:
                    $ref: '#/components/schemas/RequesterDealRecord'
        '400':
          description: Deal in wrong state or result hash mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deal not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/artifacts/publish:
    post:
      operationId: publishProviderArtifact
      summary: Publish an artifact-backed provider service
      description: >
        Provider-control endpoint for publishing a locally built artifact as a
        named service through `froglet.publication-intent.v1`. When a private
        verification fixture is supplied, the provider executes it locally
        before persistence and returns `LocalVerificationEvidence` plus a
        `froglet.publication-revision.v1` signed statement. These are
        application-layer publication records, not Kernel artifacts.
        `starter`, `input_schema`, and `output_schema` are client guidance
        metadata and do not replace handler-side validation.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderControlPublishArtifactRequest'
      responses:
        '201':
          description: >
            Published offer metadata and signed artifact references. Local
            verification and publication revision evidence are present only
            when a verification fixture ran successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderControlMutationResponse'
        '400':
          description: Invalid publication request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid provider-control bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Verification input or expected output exceeds a publication limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Local verification was unsafe, unavailable, failed, or mismatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Local verification execution capacity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/managed-publications/package-request:
    post:
      operationId: getManagedPublicationPackageRequest
      summary: Resolve exact private OCI packaging inputs
      description: Read-only target/profile lookup returning the canonical package request and digest-verified base OCI manifest/config bytes.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, target, profile]
              properties:
                bundle: { $ref: '#/components/schemas/ManagedPublicationBundle' }
                target: { type: string }
                profile: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Exact package request plus base manifest/config base64.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '409':
          description: Target profile or immutable base inputs are unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/plan:
    post:
      operationId: planManagedPublication
      summary: Plan one provider-neutral Managed Publication
      description: Read-only external-operator planning; no registry, host, DNS, or cloud mutation is allowed.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, package, target, profile]
              properties:
                bundle: { $ref: '#/components/schemas/ManagedPublicationBundle' }
                package: { $ref: '#/components/schemas/ManagedPublicationPackage' }
                target: { type: string }
                profile: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Exact approval-bound plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationPlan' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '409':
          description: Target/profile/package cannot produce a valid mutation-free plan.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/upload:
    post:
      operationId: uploadManagedPublicationImage
      summary: Upload the exact private image through OCI Distribution
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, layout]
              properties:
                plan: { $ref: '#/components/schemas/ManagedPublicationPlan' }
                layout: { type: object, additionalProperties: true }
              additionalProperties: false
      responses:
        '200':
          description: Registry exposes the exact digest-addressed manifest.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400':
          description: Layout differs from the approved package.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '428':
          description: Exact plan and consent were not durably prepared before mutation.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Registry upload or exact digest verification failed.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/prepare:
    post:
      operationId: prepareManagedPublicationDurably
      summary: Persist the exact plan and consent before external mutation
      description: Idempotent compare-and-match gate required before registry upload; a different plan or consent conflicts.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, consent_hash]
              properties:
                plan: { $ref: '#/components/schemas/ManagedPublicationPlan' }
                consent_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
              additionalProperties: false
      responses:
        '200':
          description: Exact plan and consent are durable; an existing matching operation returns its current phase for idempotent resume.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '409':
          description: Existing operation has a different immutable plan or consent.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/capsule:
    post:
      operationId: buildManagedPublicationCapsule
      summary: Build the exact identity and signed-revision handoff
      description: Read-only derivation of an endpoint-specific Descriptor/Offer/Revision from one exact locally verified source revision.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, consent_hash, revision_hash]
              properties:
                plan: { $ref: '#/components/schemas/ManagedPublicationPlan' }
                consent_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
                revision_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
              additionalProperties: false
      responses:
        '200':
          description: Self-contained exact managed capsule.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationCapsule' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '409':
          description: Source revision or exact artifact chain is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/import:
    post:
      operationId: importManagedPublication
      summary: Import and reproduce one exact managed Revision
      description: Managed-runner endpoint. It verifies paired identity, target configuration, private local fixture, Descriptor/Offer binding, and byte-identical Revision before atomic persistence.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, capsule]
              properties:
                bundle: { $ref: '#/components/schemas/ManagedPublicationBundle' }
                capsule: { $ref: '#/components/schemas/ManagedPublicationCapsule' }
              additionalProperties: false
      responses:
        '200':
          description: Exact managed Revision is active on this node.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '400':
          description: Bundle or capsule is invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '409':
          description: Target configuration would materialize a different artifact chain.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '412':
          description: Managed runner does not hold the approved Provider identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Private fixture did not reproduce the signed evidence.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/activate:
    post:
      operationId: activateManagedPublication
      summary: Durably provision, deploy, and canary a Managed Publication
      description: Records every external phase before mutation, executes only exact approval hashes, and invokes pre-approved compensation on failure.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle, capsule]
              properties:
                bundle: { $ref: '#/components/schemas/ManagedPublicationBundle' }
                capsule: { $ref: '#/components/schemas/ManagedPublicationCapsule' }
              additionalProperties: false
      responses:
        '200':
          description: Deployment reached exact remote-canary verification.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '409':
          description: Durable state, profile, or reconciliation conflict.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: External operation or canary failed; response records compensation outcome.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/operations/{operation_id}:
    get:
      operationId: getManagedPublicationOperation
      summary: Read one durable Managed Publication operation
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ManagedPublicationOperationId' }]
      responses:
        '200':
          description: Validated durable operation record.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '404':
          description: Operation not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/operations/{operation_id}/reconcile:
    post:
      operationId: reconcileManagedPublicationOperation
      summary: Reconcile an interrupted external mutation
      description: Uses read-only adapter status; unknown outcomes are not blindly replayed.
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ManagedPublicationOperationId' }]
      responses:
        '200':
          description: Reconciled to a proven canary-verified or compensated state.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '404':
          description: Operation not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Status or compensation could not prove a terminal outcome.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/operations/{operation_id}/compensate:
    post:
      operationId: compensateManagedPublicationOperation
      summary: Execute the exact pre-approved compensation plan
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ManagedPublicationOperationId' }]
      responses:
        '200':
          description: Compensation is durably proven or was already complete.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '404':
          description: Operation not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Compensation outcome requires reconciliation.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/operations/{operation_id}/registering:
    post:
      operationId: beginManagedPublicationRegistration
      summary: Durably enter marketplace registration
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ManagedPublicationOperationId' }]
      responses:
        '200':
          description: Registration phase is durable and idempotent.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '404':
          description: Operation not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Remote canary has not been proven.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/managed-publications/operations/{operation_id}/complete:
    post:
      operationId: completeManagedPublicationRegistration
      summary: Persist exact marketplace registration evidence
      tags: [Provider Control]
      security: [{ ProviderControlBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ManagedPublicationOperationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPublicationRegistration' }
      responses:
        '200':
          description: Operation is active with exact normalized registration evidence.
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedPublicationOperationRecord' } } }
        '400':
          description: Registration does not match the exact capsule Offer or Revision.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/ProviderControlUnauthorized' }
        '404':
          description: Operation not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Operation is not awaiting registration or has different evidence.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/provider/transports/relay/activate:
    post:
      operationId: activateExactRelayTransportGrant
      summary: Activate relay forwarding for one exact publication instance
      description: >
        Atomically validates and persists the exact service, revision,
        activation token, approval-bound public URL, and exact relay control
        endpoint, then opens or shares the relay tunnel and waits for that exact
        endpoint to report `up`.
        Repeating the same request is idempotent. Configuration alone never
        calls this endpoint and never opens forwarding.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayTransportActivationRequest'
      responses:
        '200':
          description: Exact grant is durable and the endpoint is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayTransportActivationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '500':
          description: Grant or gate synchronization entered a reported partial state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Relay activation failed and the attempted exact grant was withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/transports/relay/deactivate:
    post:
      operationId: deactivateExactRelayTransportGrant
      summary: Withdraw one exact relay transport grant
      description: >
        Compare-and-delete withdrawal for one exact activation. The shared
        tunnel stays online while any other exact publication grant remains.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayTransportActivationRequest'
      responses:
        '200':
          description: Grant is absent after this idempotent request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayTransportDeactivationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '500':
          description: Grant withdrawal or activation-gate synchronization failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/publications:
    get:
      operationId: listProviderPublications
      summary: List immutable publication lifecycles
      description: >
        Returns the provider-local activation state for services that have a
        verified immutable Publication Revision. Legacy offers without such a
        revision are not synthesized into this list.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Bounded lifecycle list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationsResponse'
        '401':
          description: Missing or invalid provider-control bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Publication lifecycle storage failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/publications/{service_id}:
    get:
      operationId: getProviderPublication
      summary: Get a publication lifecycle
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
      responses:
        '200':
          description: Exact service lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Publication lifecycle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Publication lifecycle storage failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/publications/{service_id}/revisions:
    get:
      operationId: listProviderPublicationRevisions
      summary: List immutable revisions for a service
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Newest-first bounded immutable revision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationRevisionsResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: No immutable lifecycle exists for this service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Publication revision storage failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/publications/{service_id}/revisions/{revision_hash}:
    get:
      operationId: getProviderPublicationRevision
      summary: Get and re-verify one immutable revision
      description: >
        Loads the exact revision, verifies its signature and stored metadata,
        and fails with 500 rather than returning corrupt local state.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
        - $ref: '#/components/parameters/PublicationRevisionHash'
      responses:
        '200':
          description: Verified stored revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationRevisionResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Exact revision not found for this service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Stored revision is unreadable, invalid, or failed verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/publications/{service_id}/revisions/{revision_hash}/pause:
    post:
      operationId: pauseExactProviderPublicationActivation
      summary: Pause one exact publication activation instance
      description: >
        Compensation-only compare-and-swap operation. Both the immutable
        revision hash and its opaque activation token must match current
        lifecycle state. A delayed request cannot pause a later resume or
        rollback activation of the same revision.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
        - $ref: '#/components/parameters/PublicationRevisionHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExactPublicationPauseRequest'
      responses:
        '200':
          description: >
            Current paused lifecycle. Retrying the same exact request is
            idempotent while the token still identifies current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Publication lifecycle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '415':
          description: Exact-pause compensation requires an application/json body.
        '422':
          description: The JSON body is malformed or omits activation_token.
        '500':
          $ref: '#/components/responses/PublicationLifecycleFailure'

  /v1/provider/publications/{service_id}/logs:
    get:
      operationId: listProviderPublicationOperations
      summary: List bounded publication lifecycle operations
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Newest-first bounded operation records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationOperationsResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Publication lifecycle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Publication operation storage failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/publications/{service_id}/pause:
    post:
      operationId: pauseProviderPublication
      summary: Remove the selected revision from the active projection
      description: Idempotent when already paused; cannot pause an unpublished service.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
      responses:
        '200':
          description: Current lifecycle after the pause operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Publication lifecycle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '500':
          $ref: '#/components/responses/PublicationLifecycleFailure'

  /v1/provider/publications/{service_id}/resume:
    post:
      operationId: resumeProviderPublication
      summary: Reactivate the selected paused revision
      description: Idempotent when already active; cannot resume an unpublished service.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
      responses:
        '200':
          description: Current lifecycle after the resume operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Publication lifecycle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '500':
          $ref: '#/components/responses/PublicationLifecycleFailure'

  /v1/provider/publications/{service_id}/unpublish:
    post:
      operationId: unpublishProviderPublication
      summary: Unpublish a service while retaining immutable history
      description: >
        Clears the active revision and retains the selected revision for audit
        and explicit rollback. Direct HTTP calls carry no generic confirmation
        flag; the native MCP adapter requires `confirm_service_id` to equal the
        exact service ID before it sends this request.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
      responses:
        '200':
          description: Current unpublished lifecycle; repeated calls are idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Publication lifecycle not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '500':
          $ref: '#/components/responses/PublicationLifecycleFailure'

  /v1/provider/publications/{service_id}/rollback/{revision_hash}:
    post:
      operationId: rollbackProviderPublication
      summary: Activate an exact prior validated revision
      description: >
        Moves only the activation pointer and restores the provider definition
        stored with the target revision. It never accepts an unvalidated or
        cross-service revision.
      tags: [Provider Control]
      security:
        - ProviderControlBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublicationServiceId'
        - $ref: '#/components/parameters/PublicationRevisionHash'
      responses:
        '200':
          description: Active lifecycle with the exact target selected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPublicationMutationResponse'
        '400':
          $ref: '#/components/responses/InvalidPublicationIdentifier'
        '401':
          $ref: '#/components/responses/ProviderControlUnauthorized'
        '404':
          description: Lifecycle or validated target revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/PublicationLifecycleConflict'
        '500':
          $ref: '#/components/responses/PublicationLifecycleFailure'

  /v1/publications/{revision_hash}/canary:
    post:
      operationId: invokePublicationCanary
      summary: Execute and sign a fresh challenge for an exact active revision
      description: >
        Public, concurrency-bounded marketplace/requester canary. The request must
        identify the exact active offer and revision and provide the exact
        private fixture input already bound by `local_verification.input_hash`.
        A successful result is provider-signed and challenge-bound; it is not a
        Kernel artifact and does not by itself prove marketplace activation.
      tags: [Provider Control]
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicationRevisionHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationCanaryRequestV1'
      responses:
        '200':
          description: Fresh provider-signed external invocation evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedPublicationCanaryResultV1'
        '400':
          description: Invalid request, non-canonical input, or path/body revision mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Exact active offer or its local definition was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Missing fixture/evidence, fixture mismatch, or revision is not exact and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Canary input exceeds the node body limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Local canary execution was unsafe, unavailable, failed, or mismatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Stored state, local verification, or signing failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Local canary execution capacity is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Feed & Artifacts
  # ---------------------------------------------------------------------------

  /v1/feed:
    get:
      operationId: getArtifactFeed
      summary: Paginated artifact feed
      description: >
        Returns a cursor-paginated feed of all artifacts written to this node's
        ledger (deals, quotes, receipts, offers, etc.). Use the `next_cursor`
        value from a response as the `cursor` parameter on the next request to
        page forward. When `has_more` is `false` you have reached the end of
        the feed.
      tags: [Feed & Artifacts]
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: >
            Opaque integer cursor from a previous response's `next_cursor` field.
            Omit (or pass `0`) to start from the beginning of the feed.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          description: Maximum number of artifacts per page. Server may apply a lower cap.
          schema:
            type: integer
      responses:
        '200':
          description: Feed page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - artifacts
                  - active_offer_hashes
                  - cursor_type
                  - cursor_semantics
                  - applied_cursor
                  - page_size
                  - has_more
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerArtifact'
                  active_offer_hashes:
                    type: array
                    uniqueItems: true
                    description: >
                      Complete deterministic snapshot of exact signed Offer
                      hashes active at response time. Consumers use this
                      higher-layer projection to expire publication health
                      when a revision is paused or unpublished; it is not a
                      Kernel tombstone.
                    items:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                  cursor_type:
                    type: string
                    description: Cursor type identifier (always `artifact_sequence`).
                  cursor_semantics:
                    type: string
                    description: Human-readable description of cursor semantics.
                  applied_cursor:
                    type: integer
                    format: int64
                    description: The cursor value applied for this response.
                  page_size:
                    type: integer
                    description: Number of artifacts returned in this page.
                  has_more:
                    type: boolean
                    description: Whether more artifacts are available beyond this page.
                  next_cursor:
                    type: integer
                    format: int64
                    description: >
                      Cursor to pass on the next request. Present only when
                      `has_more` is `true`.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/artifacts/{artifact_hash}:
    get:
      operationId: getArtifact
      summary: Get a single artifact by hash
      description: >
        Returns the full signed artifact document identified by its SHA-256
        hash. The hash is the `hash` field of the `SignedArtifact` envelope.
      tags: [Feed & Artifacts]
      security: []
      parameters:
        - name: artifact_hash
          in: path
          required: true
          description: SHA-256 hex digest of the artifact (the `hash` field of the SignedArtifact).
          schema:
            type: string
      responses:
        '200':
          description: Signed artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedArtifact'
        '404':
          description: Artifact not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Confidential — Provider port
  # ---------------------------------------------------------------------------

  /v1/provider/confidential/profiles/{artifact_hash}:
    get:
      operationId: getConfidentialProfile
      summary: Get a confidential execution profile
      description: >
        Returns the signed `confidential_profile` artifact for a TEE service.
        The profile describes the attestation platform, measurement, and
        encryption parameters that a requester must verify before opening a
        confidential session.
      tags: [Confidential]
      security: []
      parameters:
        - name: artifact_hash
          in: path
          required: true
          description: SHA-256 hash of the confidential profile artifact.
          schema:
            type: string
      responses:
        '200':
          description: Signed confidential profile artifact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SignedArtifact'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/ConfidentialProfilePayload'
        '404':
          description: Profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/confidential/sessions:
    post:
      operationId: openConfidentialSession
      summary: Open a confidential execution session
      description: >
        Opens a TEE session for confidential workloads. The provider generates
        an ephemeral key pair inside the TEE, obtains an attestation bundle,
        and returns the signed session artifact alongside the attestation.
        The requester must verify the attestation measurement matches the
        expected value from the profile before encrypting any input.
      tags: [Confidential]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Session open request. The exact fields mirror
                `ConfidentialSessionOpenRequest` from `src/confidential.rs`.
              properties:
                profile_hash:
                  type: string
                  description: Hash of the confidential profile to use for this session.
                requester_public_key:
                  type: string
                  description: >
                    Requester's ephemeral curve25519 public key (hex). The
                    provider will encrypt session output using this key.
              additionalProperties: true
      responses:
        '200':
          description: Session opened. Contains profile, session artifact, and attestation.
          content:
            application/json:
              schema:
                type: object
                required:
                  - profile
                  - session
                  - attestation
                properties:
                  profile:
                    allOf:
                      - $ref: '#/components/schemas/SignedArtifact'
                      - type: object
                        properties:
                          payload:
                            $ref: '#/components/schemas/ConfidentialProfilePayload'
                  session:
                    allOf:
                      - $ref: '#/components/schemas/SignedArtifact'
                      - type: object
                        properties:
                          payload:
                            $ref: '#/components/schemas/ConfidentialSessionPayload'
                  attestation:
                    $ref: '#/components/schemas/AttestationBundle'
        '400':
          description: Invalid request or profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: TEE error or internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/provider/confidential/sessions/{session_id}:
    get:
      operationId: getConfidentialSession
      summary: Get confidential session status
      description: >
        Returns the current state of a confidential session, including the
        session artifact and attestation bundle. Use this to re-fetch session
        details if needed (e.g. after a restart).
      tags: [Confidential]
      security: []
      parameters:
        - name: session_id
          in: path
          required: true
          description: Session identifier returned by `POST /v1/provider/confidential/sessions`.
          schema:
            type: string
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                type: object
                required:
                  - profile
                  - session
                  - attestation
                properties:
                  profile:
                    allOf:
                      - $ref: '#/components/schemas/SignedArtifact'
                      - type: object
                        properties:
                          payload:
                            $ref: '#/components/schemas/ConfidentialProfilePayload'
                  session:
                    allOf:
                      - $ref: '#/components/schemas/SignedArtifact'
                      - type: object
                        properties:
                          payload:
                            $ref: '#/components/schemas/ConfidentialSessionPayload'
                  attestation:
                    $ref: '#/components/schemas/AttestationBundle'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
