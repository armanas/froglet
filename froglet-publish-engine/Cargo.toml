[package]
name = "froglet-publish-engine"
version = "0.4.3"
edition = "2024"
authors = ["Armanas Povilionis-Muradian"]
homepage = "https://armanas.dev"
repository = "https://github.com/armanas/froglet"
description = "Two-call plan/approval pipeline for building, verifying, exposing, signing, and registering Froglet services."

[dependencies]
# The protocol crate is where the manifest schema + signing primitives live.
froglet-protocol = { path = "../froglet-protocol" }

# Async + HTTP for marketplace registration + provider URL probes.
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# JSON + TOML for handling manifests + offer artifacts.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL parsing + validation for hosting backends.
url = "2.5"

# Hashing for inline_source artifacts.
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Embedded, version-pinned WAT compiler. This is part of the released Froglet
# binary, so clean publication hosts do not need a Rust/Node/Python toolchain.
wat = "=1.245.1"
# Locked Python bundles accept locally supplied pure-Python wheels only. The
# builder inspects wheel metadata and paths itself; it never runs pip or a
# package resolver.
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
# Deterministic uncompressed OCI layer construction for managed packages.
tar = { version = "0.4", default-features = false }

# Error handling.
thiserror = "2.0"

# Logging.
tracing = "0.1"
rand = "0.8.6"

# Backend trait dispatch.
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.37", features = ["full", "test-util"] }
tempfile = "3"
