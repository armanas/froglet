[package]
name = "froglet-protocol"
version = "0.5.0"
edition = "2024"
authors = ["Armanas Povilionis-Muradian"]
homepage = "https://armanas.dev"
repository = "https://github.com/armanas/froglet"
description = "Froglet economic protocol: signed artifacts, canonical serialization, and cryptographic verification"

[features]
default = ["full"]
full = ["generate", "manifest", "publication", "managed"]
# Key/id generation (the only rand user). The verify path never needs this,
# which is what keeps the crate wasm32-unknown-unknown clean without
# default features.
generate = ["dep:rand"]
manifest = ["dep:toml"]
publication = ["manifest"]
managed = ["publication", "dep:url"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
k256 = { version = "0.13", features = ["schnorr"] }
rand = { version = "0.8.6", optional = true }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
# Manifest parser (Phase 0 of agent-grade publish plan): TOML for the
# froglet.toml (project) + froglet-service.toml (per-service) schemas
# defined in docs/MANIFEST.md.
toml = { version = "0.9", optional = true }
thiserror = "2.0"
url = { version = "2.5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# k256's arithmetic stack (crypto-bigint/ff/group) links rand_core→getrandom;
# on wasm32-unknown-unknown getrandom only compiles with the "js" backend.
# The verify path never draws randomness — this satisfies the link, nothing more.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rand = "0.8.6"
