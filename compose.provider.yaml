services:
  provider:
    build:
      context: .
      target: provider
    image: froglet-provider:local
    environment:
      FROGLET_PRICE_EXEC_WASM: "10"
      FROGLET_PAYMENT_BACKEND: ${FROGLET_PAYMENT_BACKEND:-lightning}
      FROGLET_LIGHTNING_MODE: ${FROGLET_LIGHTNING_MODE:-mock}
      FROGLET_LIGHTNING_REST_URL: ${FROGLET_LIGHTNING_REST_URL:-}
      FROGLET_LIGHTNING_MACAROON_PATH: ${FROGLET_LIGHTNING_MACAROON_PATH:-}
      FROGLET_LIGHTNING_TLS_CERT_PATH: ${FROGLET_LIGHTNING_TLS_CERT_PATH:-}
      FROGLET_STRIPE_SECRET_KEY: ${FROGLET_STRIPE_SECRET_KEY:-}
      FROGLET_STRIPE_API_VERSION: ${FROGLET_STRIPE_API_VERSION:-2026-03-04.preview}
      FROGLET_X402_WALLET_ADDRESS: ${FROGLET_X402_WALLET_ADDRESS:-}
      FROGLET_X402_NETWORK: ${FROGLET_X402_NETWORK:-base}
      FROGLET_X402_FACILITATOR_URL: ${FROGLET_X402_FACILITATOR_URL:-https://api.cdp.coinbase.com/platform/v2/x402}
      FROGLET_NETWORK_MODE: ${FROGLET_NETWORK_MODE:-clearnet}
      FROGLET_LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
