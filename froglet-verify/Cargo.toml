[package]
name = "froglet-verify"
version = "0.1.0"
edition = "2024"
authors = ["Armanas Povilionis-Muradian"]
homepage = "https://froglet.dev"
repository = "https://github.com/armanas/froglet"
description = "Standalone offline verifier for Froglet signed-artifact chains: envelope crypto, per-kind semantics, and full-chain validation with no network, clock, or node dependency"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "froglet-verify"
path = "src/bin/froglet-verify.rs"

[dependencies]
froglet-protocol = { path = "../froglet-protocol", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
froglet-protocol = { path = "../froglet-protocol", default-features = false }
