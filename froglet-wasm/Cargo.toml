[package]
name = "froglet-wasm"
version = "0.1.0"
edition = "2024"
authors = ["Armanas Povilionis-Muradian"]
homepage = "https://froglet.dev"
repository = "https://github.com/armanas/froglet"
description = "The signing half of the Froglet kernel compiled for the browser: fresh identities, artifact signing, and canonical hashing, used by the froglet.dev playground"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
froglet-protocol = { path = "../froglet-protocol", default-features = false, features = ["generate"] }
serde_json = "1.0"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
