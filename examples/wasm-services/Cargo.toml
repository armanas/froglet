# Sample froglet.wasm.run_json.v1 services. A standalone workspace with a release profile tuned for small WebAssembly
# modules; the site build compiles it (see docs-site/scripts/build-playground.mjs), and the playground publishes them.
[workspace]
members = ["adder", "fibonacci", "ontology-check"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
