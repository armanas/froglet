services:
  provider:
    build:
      context: .
      target: provider
    image: froglet-provider:local
    environment:
      FROGLET_DATA_ROOT: /data
      FROGLET_DB_PATH: /data/provider.node.db
      FROGLET_PRICE_EXEC_WASM: ${FROGLET_PRICE_EXEC_WASM:-0}
      FROGLET_PAYMENT_BACKEND: ${FROGLET_PAYMENT_BACKEND:-lightning}
      FROGLET_LIGHTNING_MODE: ${FROGLET_LIGHTNING_MODE:-mock}
      FROGLET_LIGHTNING_REST_URL: ${FROGLET_LIGHTNING_REST_URL:-}
      FROGLET_LIGHTNING_MACAROON_PATH: ${FROGLET_LIGHTNING_MACAROON_PATH:-}
      FROGLET_LIGHTNING_TLS_CERT_PATH: ${FROGLET_LIGHTNING_TLS_CERT_PATH:-}
      FROGLET_STRIPE_SECRET_KEY: ${FROGLET_STRIPE_SECRET_KEY:-}
      FROGLET_STRIPE_API_VERSION: ${FROGLET_STRIPE_API_VERSION:-2026-03-04.preview}
      FROGLET_X402_WALLET_ADDRESS: ${FROGLET_X402_WALLET_ADDRESS:-}
      FROGLET_X402_NETWORK: ${FROGLET_X402_NETWORK:-base}
      FROGLET_X402_FACILITATOR_URL: ${FROGLET_X402_FACILITATOR_URL:-https://api.cdp.coinbase.com/platform/v2/x402}
      FROGLET_NETWORK_MODE: ${FROGLET_NETWORK_MODE:-clearnet}
      FROGLET_PUBLIC_BASE_URL: http://provider:8080
      FROGLET_HOST_READABLE_CONTROL_TOKEN: ${FROGLET_HOST_READABLE_CONTROL_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${FROGLET_DATA_ROOT:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  runtime:
    build:
      context: .
      target: runtime
    image: froglet-runtime:local
    depends_on:
      provider:
        condition: service_healthy
    environment:
      FROGLET_DATA_ROOT: /data
      FROGLET_DB_PATH: /data/runtime.node.db
      FROGLET_RUNTIME_PROVIDER_BASE_URL: http://provider:8080
      FROGLET_MARKETPLACE_URL: ${FROGLET_MARKETPLACE_URL:-https://marketplace.froglet.dev}
      FROGLET_PAYMENT_BACKEND: ${FROGLET_PAYMENT_BACKEND:-lightning}
      FROGLET_LIGHTNING_MODE: ${FROGLET_LIGHTNING_MODE:-mock}
      FROGLET_LIGHTNING_REST_URL: ${FROGLET_LIGHTNING_REST_URL:-}
      FROGLET_LIGHTNING_MACAROON_PATH: ${FROGLET_LIGHTNING_MACAROON_PATH:-}
      FROGLET_LIGHTNING_TLS_CERT_PATH: ${FROGLET_LIGHTNING_TLS_CERT_PATH:-}
      FROGLET_STRIPE_SECRET_KEY: ${FROGLET_STRIPE_SECRET_KEY:-}
      FROGLET_STRIPE_API_VERSION: ${FROGLET_STRIPE_API_VERSION:-2026-03-04.preview}
      FROGLET_X402_WALLET_ADDRESS: ${FROGLET_X402_WALLET_ADDRESS:-}
      FROGLET_X402_NETWORK: ${FROGLET_X402_NETWORK:-base}
      FROGLET_X402_FACILITATOR_URL: ${FROGLET_X402_FACILITATOR_URL:-https://api.cdp.coinbase.com/platform/v2/x402}
      FROGLET_NETWORK_MODE: ${FROGLET_NETWORK_MODE:-clearnet}
      FROGLET_HOST_READABLE_CONTROL_TOKEN: ${FROGLET_HOST_READABLE_CONTROL_TOKEN:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ${FROGLET_DATA_ROOT:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
